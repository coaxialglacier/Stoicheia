<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Star Page</title>
<!-- Graph and Page in the constellation theme. It reads the concept library, as archive/graph-page.html does: library-data.js, library.js, and pages.js. -->
<link rel="stylesheet" href="sky.css">
<style>
.nebula{background:
  radial-gradient(ellipse 25% 60% at 12% 55%,rgba(130,80,220,.26),transparent 70%),
  radial-gradient(ellipse 40% 40% at 70% 20%,rgba(50,80,190,.16),transparent 70%),
  radial-gradient(ellipse 35% 35% at 85% 80%,rgba(30,140,150,.12),transparent 70%),
  radial-gradient(ellipse 120% 90% at 45% 45%,#0d1330,#05070f 80%)}
aside{position:fixed;top:112px;left:18px;max-height:calc(100vh - 130px);width:350px;z-index:2;padding:22px 20px;overflow-y:auto}
.chart-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.chart-head .cmark{font-size:13px;color:var(--gold);text-shadow:0 0 10px var(--gold)}
.chart-title{font-family:Cinzel;font-size:19px;letter-spacing:.1em;color:var(--gold2)}
.chart-sub{color:var(--gold);opacity:.75;margin-top:2px}
aside p.intro{font-size:15.5px;line-height:1.45;color:var(--ink2)}
aside p.intro b{color:var(--gold2);font-weight:500}
aside svg{display:block;width:100%;height:auto;margin-top:10px}

.page{position:fixed;top:58px;left:388px;right:0;bottom:0;z-index:1;overflow-y:auto;padding:30px 44px 60px 56px}
.kicker{color:var(--gold)}
.kicker em{font-style:normal;color:var(--ink3)}
h1{font-family:Cinzel;font-weight:500;font-size:44px;letter-spacing:.05em;margin:8px 0 4px;background:linear-gradient(180deg,#fff6dc 10%,#e6c477 90%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(230,196,119,.28))}
.orn{display:flex;align-items:center;gap:12px;color:var(--gold);font-size:10px;width:420px;margin:2px 0 20px}
.orn::before,.orn::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--goldDim),transparent)}
.orn::before{flex:0 0 40px;background:var(--goldDim)}
.tabs{position:relative;display:flex;gap:6px;margin-bottom:28px;align-items:center}
.tab{font-family:Jost;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink3);padding:9px 18px;cursor:pointer;transition:color .3s}
.tab:hover{color:var(--ink2)}
.tab.on{color:var(--gold2)}
.tab b{font-family:Cinzel;font-weight:500;font-size:10px;letter-spacing:.04em;color:var(--gold);border:1px solid var(--goldDim);padding:1px 6px;margin-left:8px}
.sep{width:5px;height:5px;transform:rotate(45deg);border:1px solid var(--goldDim)}
.tabline{position:absolute;bottom:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);box-shadow:0 0 8px var(--gold);transition:left .5s cubic-bezier(.3,.9,.3,1),width .5s cubic-bezier(.3,.9,.3,1)}
.tabline::after{content:"✦";position:absolute;left:50%;top:-7px;transform:translateX(-50%);font-size:9px;color:var(--gold2);text-shadow:0 0 8px var(--gold)}
.view{animation:enter .6s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* Code in a sentence differs from the words around it only by its letters and its color. It has no box, so the space between the lines
   of a sentence stays even, and the eye reads along the line without stopping at each piece of code. A piece of code is never split
   across two lines. A part's name keeps its code in a box, because the name is where the reader looks for the part. */
code{font-family:'JetBrains Mono',monospace;font-variant-ligatures:none;font-size:.86em;color:#f3e1b6;white-space:nowrap;padding:0 .12em;border-radius:3px}
h5 code{font-size:.82em;color:var(--gold2);background:rgba(230,196,119,.09);border:1px solid rgba(230,196,119,.24);padding:2px 7px;border-radius:5px;vertical-align:1px}
.out{font-family:'JetBrains Mono',monospace;font-size:.8em;color:#fff3cf;background:rgba(3,5,14,.75);border:1px solid rgba(230,196,119,.3);padding:1px 7px}
.q{margin-bottom:32px}
/* A question is a heading, so it is larger than the answer under it. */
.q h4{font-family:Jost;font-weight:400;font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:12px}
.q p{font-size:21px;line-height:1.65;color:var(--ink);max-width:820px}
.specimen{display:inline-block;margin:2px 0 16px;padding:24px 24px 14px;font-family:'JetBrains Mono',monospace;font-variant-ligatures:none;font-size:15.5px;line-height:1.6;white-space:pre;color:rgba(236,230,214,.42)}
.specimen .kw,.specimen .str,.specimen .cm{color:inherit}
.specimen .mk.hl{color:#fff;padding:2px 5px;margin:0 1px}
.specimen .mk.hl>.lab{font-size:9.5px;bottom:calc(100% + 5px)}
.snip{margin:10px 0 14px;font-family:'JetBrains Mono',monospace;font-variant-ligatures:none;font-size:13px;line-height:1.75;padding:12px 16px;background:rgba(3,5,14,.6);border:1px solid rgba(230,196,119,.2);border-radius:12px;color:var(--ink2);white-space:pre}

.codebox{padding:20px 20px 16px}
.codebox>.caps{color:var(--gold);display:flex;justify-content:space-between}
.lines{margin-top:12px;font-family:'JetBrains Mono',monospace;font-variant-ligatures:none;font-size:14px;line-height:1.9}
.ln{display:flex;white-space:pre;position:relative;transition:background .3s,opacity .3s;padding-right:6px}
.ln.tall{padding-top:15px}
.ln s{text-decoration:none;width:30px;flex:none;color:#4c4f66;user-select:none}
.ln.cur{background:linear-gradient(90deg,rgba(230,196,119,.2),rgba(230,196,119,.03));box-shadow:inset 2px 0 0 var(--gold)}
.ln.cur s{color:var(--gold2);text-shadow:0 0 8px var(--gold)}
.ln.also{background:rgba(230,196,119,.07)}
.ln.dim{opacity:.3}
.k{color:var(--violet)} .t{color:var(--ice)} .n{color:#f0c674} .c{color:#5f6380;font-style:italic} .s{color:#a5e3b4}
@keyframes vanish{30%{background:rgba(255,246,220,.6);box-shadow:0 0 22px #fff3cf}100%{background:transparent;border-color:transparent;box-shadow:none}}
.val{margin-left:14px;font-family:Jost;font-size:11px;letter-spacing:.1em;color:var(--teal);border:1px solid rgba(127,232,210,.4);padding:0 8px;border-radius:10px;align-self:center;line-height:18px;box-shadow:0 0 10px rgba(127,232,210,.25);animation:enter .4s}
.console{margin-top:12px;border-top:1px solid rgba(230,196,119,.12);padding-top:10px}
.console div{font-family:'JetBrains Mono',monospace;font-size:13px;color:#fff3cf;line-height:1.7;animation:enter .4s}
.console .caps{color:var(--ink3)}
.after{font-family:'Lexend',sans-serif;font-size:16.5px;line-height:1.68;color:var(--ink2);margin-top:14px;padding-top:12px;border-top:1px solid rgba(230,196,119,.1)}
.partrow{display:flex;align-items:center;gap:10px;margin-top:10px;font-family:Jost;font-size:12.5px;letter-spacing:.06em;color:var(--ink);transition:opacity .4s}
.partrow .gem{width:8px;height:8px;transform:rotate(45deg);background:var(--teal);box-shadow:0 0 8px var(--teal)}
.ik{margin-left:auto;font-family:Jost;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);border:1px solid rgba(141,146,168,.3);padding:3px 10px;border-radius:20px;cursor:pointer;transition:all .2s;white-space:nowrap}
.ik:hover{color:var(--gold2);border-color:var(--gold);box-shadow:0 0 12px rgba(230,196,119,.3)}

.cols2{display:grid;grid-template-columns:minmax(0,1fr) 450px;gap:42px;align-items:start}
/* The example is as wide as its longest line, and on a wide window never narrower than 520 pixels; on a narrower window the
   parts and the steps keep at least 240 pixels each. A longer line makes the example wider. The parts and the steps share the rest. */
.ps{display:grid;grid-template-columns:minmax(240px,1fr) minmax(clamp(0px,calc(100vw - 1076px),520px),max-content) minmax(240px,1fr);gap:34px;align-items:start}
/* A part leaves the page by closing up from its own height, which "I know this" measures just before. A card has no height limit
   of its own, so a long explanation is never cut off. */
.partcard{font-family:'Lexend',sans-serif;padding:16px 0 18px;border-bottom:1px solid rgba(230,196,119,.12);transition:opacity .4s,max-height .5s .3s,padding .5s .3s;cursor:default}
.partcard h5{font-weight:500;font-size:19px;color:var(--gold2);line-height:1.35;letter-spacing:.01em}
.partcard p{position:relative;font-size:17px;line-height:1.72;color:var(--ink);margin:8px 0 10px}
.partcard.gone{opacity:0;max-height:0;padding:0;border-color:transparent;overflow:hidden}
.colhead{font-family:Jost;font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-bottom:8px;display:flex;align-items:center;gap:10px}
.colhead::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--goldDim),transparent)}
.stepnav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.stepnav .caps{margin-left:auto}
.arrow{font-family:Jost;font-size:13px;color:var(--gold2);border:1px solid var(--goldDim);width:30px;height:28px;display:grid;place-items:center;cursor:pointer;transform:rotate(0);transition:all .2s;user-select:none}
.arrow:hover{border-color:var(--gold);box-shadow:0 0 12px rgba(230,196,119,.35)}
/* The steps sit on one thin line, each with its number in a ring. The line is brighter up to the step that runs, and that step's ring is lit. */
.stp{font-family:'Lexend',sans-serif;position:relative;display:grid;grid-template-columns:22px minmax(0,1fr);gap:12px;padding:10px 12px 10px 0;font-size:17px;line-height:1.68;color:var(--ink3);cursor:pointer;transition:color .3s,background .3s;border-radius:0 12px 12px 0}
.stp::before{content:"";position:absolute;left:10.5px;top:0;bottom:0;width:1px;background:rgba(230,196,119,.16)}
.stp:first-child::before{top:20px}
.stp:last-child::before{bottom:auto;height:20px}
.stp.done::before{background:rgba(230,196,119,.5)}
.stp.cur::before{background:linear-gradient(180deg,rgba(230,196,119,.5) 20px,rgba(230,196,119,.16) 20px)}
.stp.cur:first-child::before{background:rgba(230,196,119,.16)}
.stp:hover{color:var(--ink2)}
.stp.done{color:var(--ink2)}
.stp.cur{color:var(--ink);background:linear-gradient(90deg,rgba(230,196,119,.1),transparent 85%)}
.stp .sn{position:relative;z-index:1;width:22px;height:22px;margin-top:3px;border-radius:50%;display:grid;place-items:center;font-family:Cinzel;font-size:10.5px;color:var(--gold);border:1px solid var(--goldDim);background:#080b1c;transition:all .3s}
.stp.done .sn{color:var(--gold2);border-color:rgba(230,196,119,.6)}
.stp.cur .sn{background:var(--gold);color:#150f03;border-color:var(--gold2);box-shadow:0 0 14px var(--gold),0 0 0 4px rgba(230,196,119,.13)}
.endq{font-family:'Lexend',sans-serif;margin-top:14px;padding:14px 16px;font-size:17px;line-height:1.68;animation:enter .5s}
.endq .caps{color:var(--gold);display:block;margin-bottom:6px}

/* The example is as wide as its longest line, such as line 1 of Generics, and never narrower than 372 pixels. */
.mem{display:grid;grid-template-columns:minmax(372px,max-content) minmax(0,1fr);gap:22px;align-items:start}
.ps .lines{font-size:14px}
.mem .lines{font-size:13px}
.ps .codebox{padding:22px 22px 16px}
/* The example stays beside the part or the step being read. It starts where it is, and as the page scrolls it stays 60 pixels under the
   page's 30 pixels of padding, so 90 pixels under the header, nearer the lines the reader is reading. It is a grid item, so it stays inside
   its grid row: it stops when its bottom reaches the end of the parts or of the steps, whichever ends lower. roomToStop gives the page room
   to scroll that far. */
.ps>.main-code{position:sticky;top:60px}
.mem .codebox{padding:18px 14px 14px}
.qcard{padding:14px 18px;margin-bottom:22px;font-size:19.5px;line-height:1.65}
.qcard .caps{color:var(--gold);display:block;margin-bottom:4px}
/* The answer to how it works is a few sentences, so its lines are kept short enough to read. */
.qcard.how{max-width:980px;margin-bottom:30px}
.drawing{position:relative;padding:18px 18px 8px}
.mcols{display:grid;grid-template-columns:1fr 1fr .9fr;gap:30px;position:relative;z-index:1}
.colh{font-family:Jost;font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink3);padding-bottom:6px;margin-bottom:24px;border-bottom:1px dashed rgba(185,179,164,.2)}
/* Code letters are shown as typed: <= stays two characters, not one joined sign. */
.blk{font-variant-ligatures:none;border:1px solid;padding:8px 11px 6px;margin-bottom:16px;background:rgba(6,9,22,.88);transition:box-shadow .5s,border-color .5s,opacity .5s}
.blk.new{animation:enter .6s}
.blk .bk{font-family:Jost;font-size:8.5px;letter-spacing:.2em;text-transform:uppercase}
.blk .bn{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--ink);margin:3px 0 4px}
.blk .f{display:flex;justify-content:space-between;align-items:center;font-family:'JetBrains Mono',monospace;font-size:12.5px;padding:5px 0;border-top:1px solid rgba(255,255,255,.06);color:var(--ink2)}
.blk .f b{font-weight:400;color:#fff3cf}
.blk .txt{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink3);padding:4px 0 2px}
.blk.frame{border-color:rgba(230,196,119,.45)} .blk.frame .bk{color:var(--gold)}
.blk.heap{border-color:rgba(127,232,210,.45)} .blk.heap .bk{color:var(--teal)}
.blk.global{border-color:rgba(195,176,255,.45)} .blk.global .bk{color:var(--violet)}
.blk.code{border-color:rgba(154,217,255,.35);border-style:dashed} .blk.code .bk{color:var(--ice)}
.blk.removed{border:1px dashed rgba(141,146,168,.4);opacity:.5} .blk.removed .bk{color:var(--known)}
.blk.data{border-color:rgba(154,217,255,.5)} .blk.data .bk{color:var(--ice)}
.blk.hl{border-color:var(--gold2);box-shadow:0 0 0 1px rgba(251,231,176,.5),0 0 26px rgba(230,196,119,.35)}
.ptr{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--teal);box-shadow:0 0 8px var(--teal)}
.ptr.code{background:var(--ice);box-shadow:0 0 8px var(--ice)}
svg.arrows{position:absolute;left:0;top:0;pointer-events:none;z-index:2;overflow:visible}
.memstep{margin-top:14px;padding:14px 18px}
/* The text cards sit next to code and drawings, so their pool of darker sky is smaller and does not cover them. */
.qcard.frame,.memstep.frame,.endq.frame{border-radius:26px;box-shadow:0 0 22px 8px rgba(5,7,18,.75)}
.memstep p{font-family:'Lexend',sans-serif;font-size:17px;line-height:1.7;animation:enter .45s}
.mk{position:relative;color:#fff;background:rgba(127,232,210,.12);border-bottom:1px solid var(--teal);transition:background .3s,box-shadow .3s}
.mk .lab{position:absolute;left:0;bottom:calc(100% + 1px);font-family:Jost;font-style:normal;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--teal);white-space:nowrap;line-height:1}
.mk .lab.up{bottom:calc(100% + 13px)}
.ln.taller{padding-top:28px}
.mk .mk{border-bottom-style:dotted}
/* A lit mark: a teal edge all the way round, and a glow. It flares once when the line from its part reaches it. */
.mk{transition:background .3s,box-shadow .3s,opacity .35s}
.mk.hl{background:rgba(127,232,210,.26);box-shadow:0 0 0 1px rgba(127,232,210,.85),0 0 18px rgba(127,232,210,.5);border-radius:3px;animation:markon .8s .4s}
.mk.hl>.lab{color:#eafffa;text-shadow:0 0 10px rgba(127,232,210,.9)}
@keyframes markon{30%{background:rgba(214,255,245,.5);box-shadow:0 0 0 1.5px #eafffa,0 0 30px rgba(127,232,210,.95)}}
.quiet .mk.hl{animation:none}
.mk.vanish{animation:vanish .5s forwards}
@keyframes vanish{30%{background:rgba(255,246,220,.6);box-shadow:0 0 22px #fff3cf}100%{background:transparent;border-color:transparent;box-shadow:none}}
.kw{color:var(--violet)} .str{color:#a5e3b4} .cm{color:#5f6380;font-style:italic}
samp{font-family:'JetBrains Mono',monospace;font-size:.8em;color:#fff3cf;background:rgba(3,5,14,.75);border:1px solid rgba(230,196,119,.3);padding:1px 7px}
.snip .ln s{display:none}
.figure{display:grid;grid-template-columns:1fr;gap:16px;margin:6px 0 28px}
.figure .drawing{padding:12px 10px 4px}
.figure .mcols{gap:14px}
.figure .cap{font-family:'Lexend',sans-serif;grid-column:1/-1;font-size:16.5px;line-height:1.7;color:var(--ink)}
.figure .cap b{color:var(--gold2);font-weight:500}
.muted{color:var(--ink3);font-size:17px;margin:8px 0}
.blk .f b.none{color:var(--ink3);font-style:italic}
.partcard .hex{margin-top:8px}
/* The page of an idea with no study of its own: the idea on each example that has it, with its explanation beside the code. */
.seen{margin:12px 0 44px}
.seen .colhead{margin-bottom:18px}
.seen-go{order:2;font-family:Jost;font-size:10px;letter-spacing:.2em;color:var(--ink3);text-decoration:none;white-space:nowrap}
.seen-go:hover{color:var(--gold2)}
.seen .colhead::after{order:1}
.seen-grid{position:relative;display:grid;grid-template-columns:minmax(320px,510px) minmax(0,max-content);gap:52px;align-items:start}
.seen-grid.drawn{grid-template-columns:minmax(280px,420px) minmax(0,1fr)}
.seen-grid .lines{font-size:14px}
.seen-grid .codebox{padding:22px 22px 16px}
.seen-grid .partcard{border-bottom:0;padding-top:4px}
.colh.target{color:var(--gold2);border-bottom-color:rgba(230,196,119,.6);text-shadow:0 0 10px rgba(230,196,119,.6)}

/* ---------- Pointing: what you point at lights its code, and a line goes there ---------- */
/* A part that is pointed at: a thin teal line lights at its left, and its name glows. The line stays on that part's own heading and
   paragraph, so an outer part's line never clamps its sub-parts into one block. */
.partcard{position:relative;padding-left:18px}
.partcard>p::before{content:"";position:absolute;left:-18px;top:-34px;bottom:2px;width:1.5px;background:linear-gradient(180deg,rgba(230,196,119,.35),rgba(230,196,119,.08));opacity:.35;transition:opacity .3s,background .3s,box-shadow .3s}
.partcard.lit>p::before{background:linear-gradient(180deg,var(--teal),rgba(127,232,210,.18));box-shadow:0 0 8px var(--teal);opacity:1}
/* A part's name and its "I know this" share one line, as on archive/graph-page.html, so the line to the code leaves from the end of that line
   and never crosses the part's sentences. In a narrow column, "I know this" goes under the name, at the right. */
.phead{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
.phead .ik{flex:none}
.seen .partcard.lit>.phead::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(230,196,119,.18),rgba(251,231,176,.45))}
.partcard p{margin:8px 0 0}
.partcard h5{transition:color .3s,text-shadow .3s}
.partcard.lit>.phead h5{color:#fff6dc;text-shadow:0 0 14px rgba(230,196,119,.55)}
/* A part inside a part, such as the type parameter inside a generic parameter clause, is explained under the outer part's sentences,
   set in from them with generous air above it, its own name, its own "I know this", and its own line to its marks. */
.partcard.sub{margin-top:26px;padding:22px 0 0 20px;border-top:1px solid rgba(230,196,119,.12);border-bottom:0}
.partcard.sub>p::before{left:-20px;top:-33px}
.partcard.sub h5{font-size:18px}
.partcard.sub p{margin-bottom:0}
.partcard.sub.gone{margin-top:0;padding:0;border-color:transparent}
/* The rest of the code fades, so what is lit is the one thing to look at. On a line with something lit, the other marks fade. */
.focus>.ln{opacity:.4}
.focus>.ln.dim{opacity:.18}
.focus>.ln.has-on{opacity:1}
.focus>.ln.has-on .mk:not(.hl):not(.hold){opacity:.32}
/* A name of code in a sentence. Pointing at it lights the same code, in gold. */
code.mention{cursor:pointer;transition:background .2s,border-color .2s,color .2s}
code.mention:hover,code.mention.on{background:rgba(230,196,119,.2);box-shadow:0 0 0 2px rgba(230,196,119,.2);color:#fff6dc}
code.unmatched{text-decoration:underline wavy rgba(255,130,120,.8)}
.ref{border-radius:3px;transition:background .2s,box-shadow .2s,color .2s}
.ref.on{background:rgba(251,231,176,.16);box-shadow:0 0 0 1px rgba(251,231,176,.8),0 0 16px rgba(230,196,119,.45);color:#fff}
.ref.flash{animation:refflash 1s}
@keyframes refflash{0%,50%{background:rgba(255,246,220,.5);box-shadow:0 0 0 1.5px #fff6dc,0 0 26px rgba(230,196,119,.8)}}
/* Each line that a step runs has that step's number in a ring at its right. The ring of the step that runs is lit. */
.badge{margin-left:auto;align-self:center;flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font:500 10px/1 Cinzel;color:var(--gold);border:1px solid var(--goldDim);background:#080b1c;transition:all .3s}
.badge.on{background:var(--gold);color:#150f03;border-color:var(--gold2);box-shadow:0 0 14px var(--gold),0 0 0 4px rgba(230,196,119,.13);animation:badgeon .9s .4s}
@keyframes badgeon{30%{box-shadow:0 0 24px #fff3cf,0 0 0 6px rgba(230,196,119,.3)}}
.same-step .badge.on{animation:none}
.nry{margin-left:auto;align-self:center;font-style:normal;font-family:Jost;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold2)}
.nry+.badge{margin-left:12px}
/* The lines: a soft glow under a fine line, drawn in from where it starts. A small shooting star then runs along it, again and again. */
.ps{position:relative}
svg.links{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:3}
svg.links path{fill:none;stroke-linecap:round}
/* While a part or a name of code is pointed at, the step's line fades with the code it goes to. */
.slink{transition:opacity .35s}
.pointing .slink{opacity:.3}
/* The glow is a wide, faint stroke, not a blur: the shooting stars redraw the lines every frame, and a blur would be redone each time. */
.lglow{stroke-width:7;opacity:.12}
.lcore{stroke-width:1.3}
.lcomet{stroke:#fffbea}
.lhalo{opacity:.18}
.trace{stroke-dasharray:1;stroke-dashoffset:1;animation:trace .5s cubic-bezier(.5,0,.25,1) forwards}
@keyframes trace{to{stroke-dashoffset:0}}
.lburst{fill:none;stroke-width:1.4;opacity:0;transform-box:fill-box;transform-origin:center;animation:lburst .75s .42s ease-out forwards}
@keyframes lburst{0%{opacity:.95;transform:scale(.4)}100%{opacity:0;transform:scale(3.6)}}
</style>
</head>
<body>
<div class="nebula"></div>
<canvas id="sky"></canvas>
<div id="stage">
<header>
  <a class="back" id="toHome">← The library</a><a class="back" id="toExpand">← Expand to Parts</a>
  <span class="caps" style="color:var(--gold2);letter-spacing:.26em">Dependency graph · Graph and Page</span>
  <span class="grow"></span>
  <span class="caps">← → steps, then views</span>
  <a class="harp" id="harp" aria-label="Music"></a>
  <a class="you" id="you" aria-label="You"></a>
</header>

<aside class="frame">
  <div class="chart-head"><span class="cmark">✦</span><div><div class="chart-title">Star chart</div><div class="caps chart-sub" id="chartSub"></div></div></div>
  <p class="intro" id="intro"></p>
  <svg id="graph" viewBox="0 0 310 640" preserveAspectRatio="xMidYMin meet"></svg>
</aside>

<div class="page" id="page">
  <div class="caps kicker" id="kicker"></div>
  <h1 id="title"></h1>
  <div class="orn">✦</div>
  <div class="tabs" id="tabs"></div>
  <div id="view"></div>
</div>
</div>
<div id="flash"></div>
<div id="card" class="frame"></div>

<script src="sky.js?v=4"></script>
<script src="library-data.js?v=4"></script>
<script src="library.js?v=4"></script>
<script src="pages.js?v=4"></script>
<script src="you.js?v=4"></script>
<script>
// Graph and Page in the constellation theme. Everything on it comes from the concept library, the same as archive/graph-page.html:
// LIB.study(id) gives the study of a concept, with each concept's views as HTML, and Library.layoutGraph gives its graph.
// The address names the concept: page.html?id=closure. When Expand to Parts sends a concept that is inside the study of the
// idea it has open, as page.html?id=heap-object&root=captured-variables, the page opens that study, on that concept.
const { el } = Sky;
const params = new URLSearchParams(location.search);
const askedId = params.get('id'), askedRoot = params.get('root');
const inside = askedId && askedRoot && askedRoot !== askedId && LIB.hasStudy(askedRoot) && LIB.hasStudy(askedId) && studyIncludes(askedRoot, askedId);
const ROOT = inside ? askedRoot : LIB.hasStudy(askedId) ? askedId : askedId && PIECES[askedId] ? null : STUDYING.id;
const MODEL = ROOT ? LIB.study(ROOT) : null;
const { BOXES, CONCEPTS } = MODEL || { BOXES: {}, CONCEPTS: {} };
let G = MODEL ? Library.layoutGraph(MODEL, c => KNOWN.has(c)) : null;
let cur = null, step = 0;
let seenBlocks = new Set(), seenArrows = new Set();
const ROMAN = n => ['', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI', 'XII'][n] || String(n);

// ---------- What vanishes: a known part is not shown at all ----------
// On the page of a concept the reader knows, only the parts that known.json lists vanish, so the page still explains the concept.
function gone(part, concept) { return KNOWN.has(concept) ? KNOWN.lists(part) : KNOWN.has(part); }

// ---------- Code ----------
// lines: the HTML of each line, from the library. st: { cur, also, dim, value: [line, text], steps, step }.
// steps, in Parts and Steps, lists the steps of the program: each line that a step runs gets a ring with that step's number.
// A line that more than one step runs shows the step that runs now, or else the first of them.
function codeHTML(lines, st = {}) {
  const at = {};
  (st.steps || []).forEach((s, i) => (at[s.line] = at[s.line] || []).push(i));
  return lines.map((h, i) => {
    const n = i + 1, dim = (st.dim || []).includes(n), runs = at[n];
    const cls = ['ln', h.includes('data-label') ? 'tall' : '', st.cur === n ? 'cur' : '', (st.also || []).includes(n) ? 'also' : '', dim ? 'dim' : ''].join(' ');
    const val = st.value && st.value[0] === n ? `<span class="val">${st.value[1]}</span>` : '';
    const nry = dim ? '<i class="nry">does not run yet</i>' : '';
    const badge = runs ? `<b class="badge${runs.includes(st.step) ? ' on' : ''}">${(runs.includes(st.step) ? st.step : runs[0]) + 1}</b>` : '';
    return `<div class="${cls}"><s>${st.cur === n ? '✦' : n}</s><span class="src">${h || ' '}</span>${val}${nry}${badge}</div>`;
  }).join('');
}
// Takes the marks of known parts off the code: the code stays, and the mark and its label go.
function unmark(box, concept) {
  box.querySelectorAll('.mk[data-part]').forEach(m => { if (gone(m.dataset.part, concept)) m.replaceWith(...m.childNodes); });
  labelMarks(box);
}
function labelMarks(box) {
  box.querySelectorAll('.ln.tall').forEach(l => { if (!l.querySelector('.mk[data-label]')) l.classList.remove('tall'); });
  // Each label is written above its mark. A label that would run into the one before it on its line goes up one row.
  box.querySelectorAll('.mk[data-label]').forEach(m => { const e = document.createElement('em'); e.className = 'lab'; e.textContent = m.dataset.label; m.prepend(e); });
  requestAnimationFrame(() => box.querySelectorAll('.ln.tall').forEach(l => {
    let end = -Infinity;
    [...l.querySelectorAll('.lab')].sort((a, b) => a.getBoundingClientRect().x - b.getBoundingClientRect().x).forEach(e => {
      const r = e.getBoundingClientRect();
      if (r.x < end + 8) { e.classList.add('up'); l.classList.add('taller'); } else end = r.right;
    });
  }));
}
// cls 'main-code' marks the example of a view: a name of code in a sentence is looked for there, after the code beside the sentence.
const codebox = (title, inner, extra = '', cls = '') => `<div class="codebox plate ${cls}"><div class="caps"><span>${title}</span><span style="color:var(--ink3)">swift</span></div><div class="lines">${inner}</div>${extra}</div>`;
const outputHTML = out => `<div class="console"><span class="caps">Output</span>${(out || []).map(x => `<div>${Library.escapeHTML(x)}</div>`).join('')}</div>`;

// ---------- Memory drawings ----------
function drawingHTML(blocks, changed, key) {
  const hl = new Set(changed || []);
  const kindOf = b => b.kind === 'ghost' ? 'removed' : b.kind === 'frame' ? 'frame' : b.kind === 'heap' ? 'heap' : b.kind === 'data' ? 'data' : b.area === 'code' ? 'code' : 'global';
  // Each field says its name in data-f, so that an address can name one field of a block, as { to, field }.
  // An address of code, or of data about a type, is drawn in ice blue.
  const blk = b => {
    const k = kindOf(b), fresh = !seenBlocks.has(key + b.id + b.kind);
    return `<div class="blk ${k} ${hl.has(b.id) ? 'hl' : ''} ${fresh ? 'new' : ''}" data-b="${b.id}"><div class="bk">${Library.escapeHTML(b.tag || '')}</div><div class="bn">${Library.escapeHTML(b.title)}</div>` +
      (b.fields || []).map(([n, v]) => `<div class="f" data-f="${Library.escapeHTML(n)}"><span>${Library.escapeHTML(n)}</span>${v && v.to ? `<span class="ptr ${['code', 'data'].includes((blocks.find(x => x.id === v.to) || {}).area) ? 'code' : ''}" data-to="${v.to}"${v.field !== undefined ? ` data-field="${Library.escapeHTML(v.field)}"` : ''}></span>` : v && v.none ? `<b class="none">${v.none}</b>` : `<b>${Library.escapeHTML(v)}</b>`}</div>`).join('') +
      (b.note ? `<div class="txt">${b.note}</div>` : '') + `</div>`;
  };
  const of = areas => blocks.filter(b => areas.includes(b.area)).map(blk).join('');
  const top = of(['top']), code = of(['code']), data = of(['data']);
  return `<div class="drawing plate" data-key="${key}"><div class="mcols">
    <div>${top ? `<div class="colh">Top level</div>${top}` : ''}<div class="colh">Stack</div>${of(['stack'])}</div>
    <div><div class="colh">Heap</div>${of(['heap'])}</div>
    <div>${code || !data ? `<div class="colh">Code</div>${code}` : ''}${data ? `<div class="colh">Data about types</div>${data}` : ''}</div></div><svg class="arrows"></svg></div>`;
}
// The arrows of a drawing: from each address to the block it points at.
function arrows(box) {
  const svg = box.querySelector('.arrows'), B = box.getBoundingClientRect(), key = box.dataset.key;
  svg.setAttribute('width', B.width); svg.setAttribute('height', B.height);
  svg.innerHTML = `<defs>${['teal', 'ice'].map(c => `<marker id="ah-${key}-${c}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="${c === 'teal' ? '#7fe8d2' : '#9ad9ff'}" stroke-width="1.6" stroke-linecap="round"/></marker>`).join('')}
    <filter id="ag-${key}" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.5"/></filter></defs>`;
  const cols = [...box.querySelectorAll('.mcols > div')], tops = [...box.querySelectorAll('.blk')].map(b => b.getBoundingClientRect().y);
  box.querySelectorAll('.ptr').forEach(p => {
    const block = box.querySelector(`.blk[data-b="${p.dataset.to}"]`);
    const t = block && p.dataset.field !== undefined ? block.querySelector(`.f[data-f="${CSS.escape(p.dataset.field)}"]`) : block;
    if (!t) return;
    const a = p.getBoundingClientRect(), r = t.getBoundingClientRect();
    const x1 = a.x + a.width / 2 - B.x, y1 = a.y + a.height / 2 - B.y;
    const from = cols.indexOf(p.closest('.mcols > div')), to = cols.indexOf(t.closest('.mcols > div'));
    // An arrow goes into the edge of the target block: beside the field it names, or near the top of the block.
    // It never ends on a field's value, and it goes around the blocks that lie between it and its target.
    const R = block.getBoundingClientRect(), S = p.closest('.blk').getBoundingClientRect();
    const y2 = (t === block ? r.y + Math.min(22, r.height / 2) : r.y + r.height / 2) - B.y;
    const others = c => [...cols[c].querySelectorAll('.blk')].filter(x => x !== block && !x.contains(p)).map(x => x.getBoundingClientRect());
    const between = from === to && others(from).some(x => x.y >= Math.min(S.bottom, R.bottom) - 1 && x.bottom <= Math.max(S.y, R.y) + 1);
    const lo = Math.min(y1, y2) + B.y - 8, hi = Math.max(y1, y2) + B.y + 8;
    const crossed = cols.slice(from + 1, to).some((c, i) => others(from + 1 + i).some(x => x.bottom > lo && x.y < hi));
    let d;
    if (from === to && t === block && !between) {
      // In one column, with nothing between: out to the right, then into the edge of the block that faces the address.
      const up = r.y < a.y, x2 = r.right - 30 - B.x, y = (up ? r.bottom : r.y) - B.y;
      d = `M${x1} ${y1}C${x1 + 36} ${y1} ${x2} ${y + (up ? 44 : -44)} ${x2} ${y + (up ? 3 : -3)}`;
    } else if (to <= from) {
      // In one column, past other blocks or to one field, or back to a column on the left: out to the right,
      // and back into the right edge of the block.
      const x2 = R.right - B.x;
      d = `M${x1} ${y1}C${x1 + 44} ${y1} ${x2 + 44} ${y2} ${x2 + 2} ${y2}`;
    } else if (to - from === 1 || !crossed) {
      // To a column on the right, with no block in the way: into the left edge of the block.
      const x2 = R.x - B.x;
      d = `M${x1} ${y1}C${(x1 + x2) / 2} ${y1} ${(x1 + x2) / 2} ${y2} ${x2 - 2} ${y2}`;
    } else {
      // Past a column with blocks in the way: up into the space above the blocks, across, down beside the target's column,
      // and into the left edge of the block.
      const lane = Math.min(...tops) - B.y - 11, x2 = R.x - B.x;
      d = `M${x1} ${y1}C${x1 + 44} ${y1} ${x1 + 24} ${lane} ${x1 + 62} ${lane}L${x2 - 40} ${lane}C${x2 - 12} ${lane} ${x2 - 26} ${y2} ${x2 - 2} ${y2}`;
    }
    const c = p.classList.contains('code') ? 'ice' : 'teal', col = c === 'teal' ? '#7fe8d2' : '#9ad9ff';
    const k = key + p.closest('.blk').dataset.b + p.closest('.f').textContent + '>' + p.dataset.to + (p.dataset.field || '');
    el('path', { d, fill: 'none', stroke: col, 'stroke-width': 4, opacity: .3, filter: `url(#ag-${key})` }, svg);
    el('path', { d, fill: 'none', stroke: col, 'stroke-width': 1.3, 'marker-end': `url(#ah-${key}-${c})`, pathLength: 1, class: seenArrows.has(k) ? '' : 'draw', style: 'animation-delay:.25s' }, svg);
    seenArrows.add(k);
  });
}
// After the labels on the code have moved apart: the arrows of the drawings, and the lines of Parts and Steps.
// The step's line is drawn in only when the step is new.
function afterDraw(newStep) {
  requestAnimationFrame(() => setTimeout(() => {
    document.querySelectorAll('#view .drawing').forEach(arrows);
    seenBlocks = new Set([...document.querySelectorAll('#view .drawing')].flatMap(d => [...d.querySelectorAll('.blk')].map(b => d.dataset.key + b.dataset.b + (b.classList.contains('removed') ? 'ghost' : ''))));
    roomToStop(); partLines(false); stepLine(newStep);
  }, 30));
}
// In Parts and Steps, the example stops when its bottom reaches the end of the parts or of the steps, whichever ends lower. The page ends
// 60 pixels under that end, so the example could not get there: it would stay at the top, above the last part or step. When that side is
// longer than the example, #view gets room under it, so that at the end of the page the example's bottom is level with the end of that side.
// #view keeps the room while a step is drawn again, so the page does not jump back up.
function roomToStop() {
  const page = document.getElementById('page'), view = document.getElementById('view'), ps = view.querySelector('.ps');
  const code = ps && ps.querySelector(':scope > .main-code'), css = getComputedStyle(page);
  const room = page.clientHeight - parseFloat(css.paddingTop) - parseFloat(css.paddingBottom) - (code ? code.offsetHeight + parseFloat(getComputedStyle(code).top) : 0);
  view.style.paddingBottom = code && ps.offsetHeight > code.offsetHeight && room > 0 ? room + 'px' : '';
}

// ---------- The three views ----------
function whatView(c) {
  const W = CONCEPTS[c].what, R = CONCEPTS[ROOT];
  // The tab already says What it is, so the first answer has no heading of its own. The other three questions keep theirs.
  const q = (title, body) => body ? `<div class="q">${title ? `<h4>${title}</h4>` : ''}${body}</div>` : '';
  const figure = W.figure ? `<div class="figure">${W.figure.panes.map(([t, s], i) => `<div><div class="caps" style="color:var(--gold);margin-bottom:6px">${Library.escapeHTML(t)}</div>${drawingHTML(s.blocks, s.changed, 'fig' + i)}</div>`).join('')}<p class="cap">${W.figure.caption}</p></div>` : '';
  // A concept that the named concept needs says why, beside the named concept's own code.
  // A sentence with code beside it, such as this one or an answer with a snippet, is in an .own box: its names of code are looked for there first.
  const here = W.here ? `<div class="q own" data-own="here"><h4>Why ${R.name.toLowerCase()} needs it</h4><p>${W.here}</p>${codebox('The example of ' + R.name.toLowerCase(), codeHTML(R.code))}</div>` : '';
  return `<div class="cols2"><div>
      ${q('', `<p>${W.is}</p>`)}
      ${q('What problem does it solve?', W.problem && `<p>${W.problem}</p>`)}
      ${q('How does it work?', W.how && `<p>${W.how}</p>`)}
      ${q("When do you use it, and when don't you?", W.when && W.when.map((w, i) => `<div class="own" data-own="${i}"><p>${w.html}</p>${w.code ? `<div class="snip">${codeHTML(w.code)}</div>` : ''}</div>`).join(''))}
      ${figure}${here}
    </div>
    <div style="position:sticky;top:0">${codebox('The example', codeHTML(W.code), W.isAfter ? `<p class="after">${W.isAfter}</p>` : '', 'main-code')}
      <div style="margin-top:18px">${nextButton()}</div></div></div>`;
}
function partsView(c) {
  const P = CONCEPTS[c].parts, st = P.steps[step], last = step === P.steps.length - 1;
  // A part's own parts, when the view explains them, come under its sentences, and each one the reader knows leaves on its own.
  const card = (p, sub) => `<div class="partcard${sub ? ' sub' : ''}" data-part="${p.id}"${p.part && p.part !== p.id ? ` data-parent="${p.part}"` : ''}><div class="phead"><h5>${p.name}${kwTag(p.id)}</h5>${!p.part || p.part === p.id ? `<span class="ik" data-part="${p.id}">I know this</span>` : ''}</div><p>${p.html}</p>${(p.parts || []).filter(q => !gone(q.part || q.id, c)).map(q => card(q, true)).join('')}</div>`;
  // The short answer to how it works, from What it is, comes first, as on archive/graph-page.html. The parts and the steps then show it on the code.
  return `<div class="qcard frame how"><span class="caps">How does it work?</span>${CONCEPTS[c].what.how}</div>
    <div class="ps">
    <div><div class="colhead">The parts</div>
      ${P.list.filter(p => !gone(p.id, c)).map(p => card(p)).join('') || '<p class="muted">You know every part.</p>'}
    </div>
    ${codebox('The example', codeHTML(P.code, { cur: st.line, also: st.also, dim: st.dim, value: st.value, steps: P.steps, step }), outputHTML(st.out), 'main-code')}
    <div><div class="colhead">The steps</div>
      <div class="stepnav"><span class="arrow" data-step="-1">←</span><span class="arrow" data-step="1">→</span><span class="caps">Step ${step + 1} of ${P.steps.length}</span></div>
      <div class="stlist">${P.steps.map((s, i) => `<div class="stp ${i === step ? 'cur' : i < step ? 'done' : ''}" data-i="${i}"><span class="sn">${i + 1}</span><div>${s.html}</div></div>`).join('')}</div>
      ${last ? `<div class="endq frame"><span class="caps">${P.end.title}</span>${P.end.html}<div style="margin-top:12px">${nextButton()}</div></div>` : ''}
    </div>
    <svg class="links"><g class="plinks"></g><g class="slink"></g></svg></div>`;
}
function memoryView(c) {
  const M = CONCEPTS[c].memory, st = M.steps[step], last = step === M.steps.length - 1;
  return `<div class="qcard frame"><span class="caps">The question</span>${M.question}</div>
    <div class="mem">
      ${codebox('The example', codeHTML(CONCEPTS[c].code.length ? CONCEPTS[c].code : [], { cur: st.lines[0], also: st.also }), outputHTML(st.out), 'main-code')}
      <div>${drawingHTML(st.blocks, st.changed, 'm')}
        <div class="memstep frame">
          <div class="stepnav"><span class="arrow" data-step="-1">←</span><span class="arrow" data-step="1">→</span><span class="caps">Step ${step + 1} of ${M.steps.length}</span></div>
          <p>${st.html}</p>
        </div>
        ${last ? `<div class="endq frame"><span class="caps">The answer</span>${M.answer}<div style="margin-top:12px">${nextButton()}</div></div>` : ''}
      </div>
    </div>`;
}
// The button to whatever comes next: the next view of this concept, or the next concept in the teaching order.
function nextButton() {
  const n = nextPlace(); if (!n) return '';
  const c = BOXES[n.box].concept;
  // A button to another number of the star chart says that number.
  const label = (n.box === cur.box ? '' : ROMAN(G.order.indexOf(n.box) + 1) + ' · ') + (c === BOXES[cur.box].concept ? Library.VIEW_NAMES[n.view] : CONCEPTS[c].name + ' · ' + Library.VIEW_NAMES[n.view]);
  return `<a class="hex gold" data-next><span>Next ✦ ${label} →</span></a>`;
}

// ---------- Where the reader is: a box of the graph, and one of its views ----------
// Every place in teaching order: each box that is taught, and each of its views. A known concept is not taught, but its page can be opened.
function places() { return G.order.flatMap(b => BOXES[b].views.map(v => ({ box: b, view: v }))); }
function nextPlace(dir = 1) {
  const all = places(), i = all.findIndex(p => p.box === cur.box && p.view === cur.view);
  return i < 0 ? null : all[i + dir] || null;
}
function stepsOf() { const C = CONCEPTS[BOXES[cur.box].concept]; return cur.view === 'parts' ? C.parts.steps : cur.view === 'memory' ? C.memory.steps : null; }
function show(box, view, atEnd) {
  if (!cur || cur.box !== box || cur.view !== view) { seenBlocks = new Set(); seenArrows = new Set(); }
  cur = { box, view };
  restPoint = null;
  const s = stepsOf(); step = atEnd && s ? s.length - 1 : 0;
  const c = BOXES[box].concept, C = CONCEPTS[c];
  document.getElementById('kicker').innerHTML = (c === ROOT ? 'The concept you named' : 'Needed for ' + Library.escapeHTML(CONCEPTS[ROOT].name.toLowerCase())) +
    ` <em>· ${BOXES[box].section === 'memory' ? 'memory' : 'the code'}${KNOWN.has(c) ? ' · known' : ''}</em>` +
    (G.order.includes(box) ? ` <em>·</em> ${ROMAN(G.order.indexOf(box) + 1)} <em>of ${ROMAN(G.order.length)}</em>` : '');
  document.getElementById('title').textContent = C.name;
  // A tab for each view the concept has, with its number in the teaching order when it is not the box that is open.
  const boxOfView = v => Object.keys(BOXES).find(b => BOXES[b].concept === c && BOXES[b].views.includes(v) && !BOXES[b].copyOf);
  const tabs = Library.VIEW_ORDER.filter(v => C[v]);
  document.getElementById('tabs').innerHTML = tabs.map((v, i) => {
    const b = boxOfView(v), n = G.order.indexOf(b);
    return (i ? '<span class="sep"></span>' : '') + `<span class="tab ${v === view ? 'on' : ''}" data-v="${v}">${Library.VIEW_NAMES[v]}${b !== box && n >= 0 ? ` <b>${ROMAN(n + 1)}</b>` : ''}</span>`;
  }).join('') + '<div class="tabline" id="tabline"></div>';
  document.querySelectorAll('.tab').forEach(t => t.onclick = () => show(boxOfView(t.dataset.v) || box, t.dataset.v));
  const on = document.querySelector('.tab.on'), line = document.getElementById('tabline');
  requestAnimationFrame(() => { line.style.left = on.offsetLeft + 'px'; line.style.width = on.offsetWidth + 'px'; });
  draw(true);
  document.getElementById('page').scrollTop = 0;
  graph();
}
function draw(enter) {
  const c = BOXES[cur.box].concept;
  const html = cur.view === 'what' ? whatView(c) : cur.view === 'parts' ? partsView(c) : memoryView(c);
  const box = document.getElementById('view');
  box.innerHTML = `<div class="view" style="${enter ? '' : 'animation:none'}">${html}</div>`;

    const B = BOXES[g.dataset.b], I = LIB.ideas[B.concept];
    g.onmouseenter = () => { const r = g.getBoundingClientRect();
      Sky.show({ name: I.name, first: Library.escapeHTML(I.first), note: KNOWN.has(B.concept) ? 'Known' : 'Read ' + ROMAN(G.order.indexOf(g.dataset.b) + 1) + ' of ' + ROMAN(G.order.length), tone: KNOWN.has(B.concept) ? 'known' : '' }, r.x + r.width / 2, r.y + r.height / 2); };
    g.onmouseleave = Sky.hide;
    g.onclick = () => { const b = B.copyOf || g.dataset.b; show(b, BOXES[b].views[0]); };
  });
}

// ---------- An idea with no study of its own, such as a part: its first fact, what it is made of, and what uses it ----------
// The page shows the idea itself, never only words about it: each place where a concept's example has it, with that concept's
// own explanation of it from Parts and Steps, and a line to each of its marks on the code, as Parts and Steps draws them.
// placesOf finds those places, in this order, and stops at the first rule that finds any:
// 1. the concepts whose Parts and Steps explain it, as a part or as a part inside a part, and mark it on their code. When the explanation
//    has the idea's own parts under it, they come too, each with its own marks;
// 2. for a part inside another part, such as an argument inside a call: the marks of the outer part whose label is this part's name;
// 3. the concepts whose What it is marks it on their example;
// 4. for memory, such as a context: a block of that name in a drawing of memory;
// 5. for a region of memory, such as the stack: the drawing's column of that name, in a concept that the ideas made of it depend on.
function placesOf(id) {
  const P = PIECES[id], name = P.name.toLowerCase();
  // The ideas made of it come first, then the ideas they depend on, then every other idea with a study.
  const users = Object.keys(PIECES).filter(q => PIECES[q].of.includes(id));
  const rank = k => users.includes(k) ? 0 : users.some(u => (LIB.ideas[u].deps || []).includes(k)) ? 1 : 2;
  const studies = Object.keys(LIB.ideas).filter(k => LIB.hasStudy(k)).sort((x, y) => rank(x) - rank(y));
  const model = k => LIB.study(k).CONCEPTS[k];
  const marks = (code, part) => code.some(l => l.includes(`data-part="${part}"`));
  // keep(m) gives the part that a mark on the code stays marked as, or null when the mark is taken off.
  const explained = (c, x) => {
    if (!c.parts) return null;
    for (const p of c.parts.list) {
      if (p.id === x) return p;
      const q = (p.parts || []).find(s => s.id === x);
      if (q) return { ...q, parts: p.parts.filter(s => s.part === x && s.id !== x) };
    }
    return null;
  };
  let out = studies.flatMap(k => {
    const c = model(k), p = explained(c, id), ids = p ? [id, ...(p.parts || []).map(q => q.id)] : [];
    return p && marks(c.parts.code, id) ? [{ concept: k, name: p.name, html: p.html, parts: p.parts, code: c.parts.code, keep: m => ids.includes(m.dataset.part) ? m.dataset.part : null }] : [];
  });
  if (!out.length) out = Object.keys(PIECES).filter(q => PIECES[q].of.includes(id)).flatMap(q => studies.flatMap(k => {
    const c = model(k), p = explained(c, q);
    const keep = m => m.dataset.part === q && (m.dataset.label || '').toLowerCase() === name ? id : null;
    return p && c.parts.code.some(l => l.includes(`data-part="${q}" data-label="${name}"`)) ? [{ concept: k, name: P.name, html: p.html, code: c.parts.code, keep }] : [];
  }));
  if (!out.length) out = studies.flatMap(k => { const c = model(k); return c.what && marks(c.what.code, id) ? [{ concept: k, name: P.name, code: c.what.code, keep: m => m.dataset.part === id ? id : null }] : []; });
  // The drawings of a concept: the panes of its figure, then each step of In memory.
  const drawings = k => { const c = model(k); return [...(c.what && c.what.figure ? c.what.figure.panes.map(([, s]) => s.blocks) : []), ...(c.memory ? c.memory.steps.map(s => s.blocks) : [])]; };
  if (!out.length) out = studies.flatMap(k => {
    const blocks = drawings(k).find(bs => bs.some(b => b.title.toLowerCase() === name));
    return blocks ? [{ concept: k, name: P.name, blocks, target: b => b.title.toLowerCase() === name }] : [];
  }).slice(0, 1);
  if (!out.length && ['stack', 'heap'].includes(name)) {
    const k = studies.find(k => drawings(k).length);
    if (k) out = [{ concept: k, name: P.name, blocks: drawings(k)[0], column: name }];
  }
  return out;
}
function specimenHTML(id, s, P) {
  if (!s || !s.code) return '';
  const tmp = document.createElement('div');
  for (const line of s.code) {
    tmp.innerHTML = line;
    tmp.querySelectorAll('.mk[data-part]').forEach(m => {
      const to = s.keep && s.keep(m);
      if (to === id) m.dataset.part = id; else m.replaceWith(...m.childNodes);
    });
    const mk = tmp.querySelector(`.mk[data-part="${id}"]`);
    if (mk) {
      mk.classList.add('hl', 'quiet');
      const lab = document.createElement('em');
      lab.className = 'lab';
      lab.textContent = P.name;
      mk.prepend(lab);
      return `<div class="specimen plate">${tmp.innerHTML.replace(/\s*\{\s*$/, '')}</div>`;
    }
  }
  return '';
}
function partPage(id) {
  const P = PIECES[id], users = Object.keys(PIECES).filter(k => PIECES[k].of.includes(id));
  document.getElementById('kicker').innerHTML = 'An idea in the library <em>· no study of its own yet</em>';
  document.getElementById('title').innerHTML = nameHTML(id);
  document.getElementById('tabs').innerHTML = '';
  const places = placesOf(id), first = Library.escapeHTML(P.first);
  document.querySelector('aside').innerHTML = `<p class="intro"><b>${nameHTML(id, false)}</b> has no example of its own, so it has no graph yet. ${places.length ? 'This page shows it in the example of each idea that has it.' : 'It is explained in the study of each idea that is made of it.'}</p>`;
  const list = ids => ids.map(k => `<div class="partcard"><h5>${nameHTML(k)}</h5><p>${Library.escapeHTML(PIECES[k].first)}</p>${LIB.hasStudy(k) ? `<a class="hex" href="page.html?id=${k}"><span>Open its study →</span></a>` : ''}</div>`).join('');
  // When the first place has no explanation of its own, its card answers "What is it?", so the answer is not written twice.
  const own = places.length && places[0].html;
  const spec = specimenHTML(id, places[0], P);
  const place = (s, i) => `<section class="seen own" data-own="p${i}">
      <div class="colhead">In the example of ${LIB.ideas[s.concept].name.toLowerCase()}${LIB.hasStudy(s.concept) ? `<a class="seen-go" href="page.html?id=${s.concept}">Open its study →</a>` : ''}</div>
      <div class="seen-grid${s.blocks ? ' drawn' : ''}">
        <div><div class="partcard" data-part="${id}"><div class="phead"><h5>${s.html ? s.name + kwTag(id) : i ? nameHTML(id) : 'What is it?'}</h5></div><p>${s.html || first}</p>${(s.parts || []).map(q => `<div class="partcard sub" data-part="${q.id}"><div class="phead"><h5>${q.name}${kwTag(q.id)}</h5></div><p>${q.html}</p></div>`).join('')}</div></div>
        ${s.code ? codebox('The example', codeHTML(s.code), '', 'main-code') : drawingHTML(s.blocks, [], 'part' + i)}
        <svg class="links"><g class="plinks"></g></svg>
      </div></section>`;
  document.getElementById('view').innerHTML = `<div class="view">${own || !places.length ? `<div class="q"><h4>What is it?</h4>${spec}<p>${first}</p></div>` : ''}
    ${places.map(place).join('')}
    ${P.of.length ? `<div class="colhead">What it is made of</div>${list(P.of)}` : '<p class="muted">It cannot be split any further.</p>'}
    ${users.length ? `<div class="colhead" style="margin-top:24px">The ideas made of it</div>${list(users)}` : ''}</div>`;
  const view = document.getElementById('view');
  // Only the marks of this part, and of its own parts explained under it, stay on each example. A part inside another part that the
  // example does not mark on its own takes over the outer part's mark that has its name.
  view.querySelectorAll('.seen').forEach((sec, i) => {
    const s = places[i];
    sec.querySelectorAll('.mk[data-part]').forEach(m => { const to = s.keep && s.keep(m); if (to) m.dataset.part = to; else m.replaceWith(...m.childNodes); });
    if (s.target) sec.querySelectorAll('.blk').forEach(b => { const x = s.blocks.find(x => x.id === b.dataset.b); if (x && s.target(x)) b.classList.add('hl', 'target'); });
    if (s.column) sec.querySelectorAll('.colh').forEach(h => { if (h.textContent.trim().toLowerCase() === s.column) h.classList.add('target'); });
  });
  labelMarks(view);
  mentions(view);
  // Once the labels have moved apart, the part is lit, and its lines are drawn in.
  requestAnimationFrame(() => setTimeout(() => {
    view.querySelectorAll('.drawing').forEach(arrows);
    restPoint = id; pointed = null; point(id);
  }, 40));
}

// ---------- Starting ----------
// The arrow keys move a volume, not the steps, while it is chosen in a panel under the harp or the user icon.
addEventListener('keydown', e => { if (!G || e.target.closest('.ypanel')) return; if (e.key === 'ArrowRight') go(1); if (e.key === 'ArrowLeft') go(-1); });
addEventListener('resize', () => { document.querySelectorAll('#view .drawing').forEach(arrows); roomToStop(); partLines(false); stepLine(false); });
// In Parts and Steps the example stays in place while the parts and the steps scroll, so the lines between them are drawn again, once a frame.
let relink = 0;
document.getElementById('page').addEventListener('scroll', () => {
  if (relink || !cur || cur.view !== 'parts') return;
  relink = requestAnimationFrame(() => { relink = 0; partLines(false, true); stepLine(false, true); });
});
document.fonts.ready.then(() => { roomToStop(); partLines(false); stepLine(false); });
// Pointing: at a name of code in a sentence, at a part, or at a part's mark on the code. Between two parts, the part stays lit.
document.addEventListener('mouseover', e => {
  const m = e.target.closest('#view code.mention');
  if (m) return point('ref:' + m.dataset.ref);
  // On the page of an idea with no study of its own, pointing at one of its parts explained under it lights that part's marks.
  if (!cur) { const sub = e.target.closest('#view .seen .partcard.sub'); return point(sub ? sub.dataset.part : null); }
  const parts = cur.view === 'parts';
  const card = parts && e.target.closest('#view .partcard[data-part]:not(.gone)');
  const mark = parts && e.target.closest('#view .main-code .mk[data-part]');
  if (card) point(card.dataset.part);
  else if (mark && document.querySelector(`#view .partcard[data-part="${mark.dataset.part}"]`)) point(mark.dataset.part);
  else if (!(parts && pointed && !pointed.startsWith('ref:') && e.target.closest('#view .ps > div:first-child'))) point(null);
});
// Clicking a name of code brings its code into view, and the code flashes.
document.addEventListener('click', e => {
  const m = e.target.closest('#view code.mention'); if (!m) return;
  const refs = [...document.querySelectorAll(`#view .ref[data-ref="${m.dataset.ref}"]`)], r = refs[0].getBoundingClientRect();
  if (r.top < 70 || r.bottom > innerHeight) refs[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
  refs.forEach(x => { x.classList.remove('flash'); void x.offsetWidth; x.classList.add('flash'); });
});
// The way back to Home leads into the constellation of the idea this page is about, and says its name.
const home = homeOf(askedRoot || askedId || ROOT);
document.getElementById('toHome').textContent = '← ' + home.name;
document.getElementById('toHome').onclick = () => Sky.go(home.href, 60, 30);
document.getElementById('toExpand').onclick = () => Sky.go('expand.html' + (askedRoot ? `?root=${askedRoot}` : ''), 180, 30);
if (!MODEL) partPage(askedId);
else {
  const taught = [...new Set(G.order.map(b => BOXES[b].concept))].filter(c => c !== ROOT).length;
  // The star chart: the concepts this study teaches, and the order they come in.
  document.getElementById('chartSub').textContent = 'of ' + CONCEPTS[ROOT].name;
  document.getElementById('intro').innerHTML = `<b>${CONCEPTS[ROOT].name}</b> is taught one level at a time: first the code, then memory. ` +
    (taught ? `It needs ${taught === 1 ? '1 concept' : taught + ' concepts'} you do not know yet, each taught right before the view that uses it.` : 'You know everything it needs.') +
    (G.order.length > 1 ? ` The number beside each one is the order you read it in: I first, then II${G.order.length > 2 ? ', down to ' + ROMAN(G.order.length) : ''}.` : '');
  // The page opens on the concept that was asked for, or else on the first place in the teaching order.
  const want = inside ? Object.keys(BOXES).find(b => BOXES[b].concept === askedId && !BOXES[b].copyOf) : null;
  const first = places()[0] || { box: G.sections[0].root, view: BOXES[G.sections[0].root].views[0] };
  if (want) show(want, BOXES[want].views[0]); else show(first.box, first.view);
}
