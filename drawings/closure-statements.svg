<svg xmlns="http://www.w3.org/2000/svg" width="680" height="812" viewBox="0 0 680 812" role="img">
<title>The closure introduction, split into facts, steps, and one concept</title>
<desc>Cortex's eleven statements about a closure, checked with Stoicheia's words: thirteen facts and four steps, in teaching order. Facts 13 to 16 make up the concept capture, which is inside the closure.</desc>
<style>
.bg{fill:#FFFFFF}
text{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;fill:#2C2C2A}
.h{font-size:14px;font-weight:600}
.s{font-size:12px}
.b{font-weight:600}
.u{text-decoration:underline}
.m{font-family:Menlo,"SF Mono",monospace;font-size:11px}
.concept{fill:#EEEDFE;stroke:#534AB7;stroke-width:0.75}
.inner{fill:#FFFFFF;stroke:#534AB7;stroke-width:0.75}
.concept-t{fill:#3C3489}
.concept-s{fill:#534AB7}
.fact{fill:#E1F5EE;stroke:#0F6E56;stroke-width:0.75}
.fact-t{fill:#085041}
.step{fill:#FAECE7;stroke:#993C1D;stroke-width:0.75}
.step-t{fill:#712B13}
@media (prefers-color-scheme: dark){
.bg{fill:#1E1E1D}
text{fill:#D3D1C7}
.concept{fill:#26215C;stroke:#AFA9EC}
.inner{fill:#1E1E1D;stroke:#AFA9EC}
.concept-t{fill:#EEEDFE}
.concept-s{fill:#CECBF6}
.fact{fill:#04342C;stroke:#5DCAA5}
.fact-t{fill:#E1F5EE}
.step{fill:#4A1B0C;stroke:#F0997B}
.step-t{fill:#FAECE7}
}
</style>
<rect class="bg" width="680" height="812"/>

<rect class="concept" x="40" y="20" width="600" height="748" rx="12"/>
<text class="h concept-t" x="60" y="49">A closure</text>
<text class="s concept-s" x="60" y="68">Concept, depth 1, width 1</text>

<rect class="fact" x="60" y="80" width="560" height="28" rx="4"/>
<text class="s fact-t" x="74" y="98" text-anchor="middle">1</text>
<text class="s fact-t b" x="92" y="98">Fact</text>
<text class="s fact-t" x="136" y="98">A closure is a block of code that can be called later.</text>

<rect class="fact" x="60" y="114" width="560" height="28" rx="4"/>
<text class="s fact-t" x="74" y="132" text-anchor="middle">2</text>
<text class="s fact-t b" x="92" y="132">Fact</text>
<text class="s fact-t" x="136" y="132">It starts at <tspan class="m">{</tspan>.</text>

<rect class="fact" x="60" y="148" width="560" height="28" rx="4"/>
<text class="s fact-t" x="74" y="166" text-anchor="middle">3</text>
<text class="s fact-t b" x="92" y="166">Fact</text>
<text class="s fact-t" x="136" y="166">It ends at the matching <tspan class="m">}</tspan>.</text>

<rect class="fact" x="60" y="182" width="560" height="28" rx="4"/>
<text class="s fact-t" x="74" y="200" text-anchor="middle">4</text>
<text class="s fact-t b" x="92" y="200">Fact</text>
<text class="s fact-t" x="136" y="200"><tspan class="m">name</tspan> is its input.</text>

<rect class="fact" x="60" y="216" width="560" height="28" rx="4"/>
<text class="s fact-t" x="74" y="234" text-anchor="middle">5</text>
<text class="s fact-t b" x="92" y="234">Fact</text>
<text class="s fact-t" x="136" y="234"><tspan class="m">String</tspan> is the type of that input.</text>

<rect class="fact" x="60" y="250" width="560" height="28" rx="4"/>
<text class="s fact-t" x="74" y="268" text-anchor="middle">6</text>
<text class="s fact-t b" x="92" y="268">Fact</text>
<text class="s fact-t" x="136" y="268"><tspan class="m">in</tspan> ends the list of inputs.</text>

<rect class="fact" x="60" y="284" width="560" height="28" rx="4"/>
<text class="s fact-t" x="74" y="302" text-anchor="middle">7</text>
<text class="s fact-t b" x="92" y="302">Fact</text>
<text class="s fact-t" x="136" y="302">The code after <tspan class="m">in</tspan> is the <tspan class="b u">body</tspan>.</text>

<rect class="fact" x="60" y="318" width="560" height="28" rx="4"/>
<text class="s fact-t" x="74" y="336" text-anchor="middle">8</text>
<text class="s fact-t b" x="92" y="336">Fact</text>
<text class="s fact-t" x="136" y="336">The body runs each time the closure is called.</text>

<rect class="step" x="60" y="352" width="560" height="28" rx="4"/>
<text class="s step-t" x="74" y="370" text-anchor="middle">9</text>
<text class="s step-t b" x="92" y="370">Step</text>
<text class="s step-t" x="136" y="370"><tspan class="m">let greet =</tspan> stores the closure.</text>

<rect class="step" x="60" y="386" width="560" height="28" rx="4"/>
<text class="s step-t" x="74" y="404" text-anchor="middle">10</text>
<text class="s step-t b" x="92" y="404">Step</text>
<text class="s step-t" x="136" y="404">The body does not run yet.</text>

<rect class="step" x="60" y="420" width="560" height="28" rx="4"/>
<text class="s step-t" x="74" y="438" text-anchor="middle">11</text>
<text class="s step-t b" x="92" y="438">Step</text>
<text class="s step-t" x="136" y="438"><tspan class="m">greet("Ana")</tspan> runs the body.</text>

<rect class="step" x="60" y="454" width="560" height="28" rx="4"/>
<text class="s step-t" x="74" y="472" text-anchor="middle">12</text>
<text class="s step-t b" x="92" y="472">Step</text>
<text class="s step-t" x="136" y="472">While the body runs, <tspan class="m">name</tspan> is <tspan class="m">"Ana"</tspan>.</text>

<rect class="inner" x="60" y="494" width="560" height="216" rx="10"/>
<text class="h concept-t" x="76" y="521">Capture</text>
<text class="s concept-s" x="76" y="540">Concept inside A closure, depth 0</text>

<rect class="fact" x="76" y="550" width="528" height="28" rx="4"/>
<text class="s fact-t" x="90" y="568" text-anchor="middle">13</text>
<text class="s fact-t b" x="108" y="568">Fact</text>
<text class="s fact-t" x="152" y="568">The body uses <tspan class="m">greeting</tspan>.</text>

<rect class="fact" x="76" y="584" width="528" height="28" rx="4"/>
<text class="s fact-t" x="90" y="602" text-anchor="middle">14</text>
<text class="s fact-t b" x="108" y="602">Fact</text>
<text class="s fact-t" x="152" y="602"><tspan class="m">greeting</tspan> is declared outside the braces.</text>

<rect class="fact" x="76" y="618" width="528" height="44" rx="4"/>
<text class="s fact-t" x="90" y="636" text-anchor="middle">15</text>
<text class="s fact-t b" x="108" y="636">Fact</text>
<text class="s fact-t" x="152" y="636">A closure captures each constant and variable from outside its braces</text>
<text class="s fact-t" x="152" y="652">that its body uses.</text>

<rect class="fact" x="76" y="668" width="528" height="28" rx="4"/>
<text class="s fact-t" x="90" y="686" text-anchor="middle">16</text>
<text class="s fact-t b" x="108" y="686">Fact</text>
<text class="s fact-t" x="152" y="686">So <tspan class="m">greet</tspan> captures <tspan class="m">greeting</tspan>.</text>

<rect class="fact" x="60" y="722" width="560" height="28" rx="4"/>
<text class="s fact-t" x="74" y="740" text-anchor="middle">17</text>
<text class="s fact-t b" x="92" y="740">Fact</text>
<text class="s fact-t" x="136" y="740">So <tspan class="m">greet</tspan> holds two parts: its code, and what it captured.</text>

<rect class="concept" x="40" y="784" width="16" height="16" rx="3"/>
<text class="s" x="64" y="796">Concept</text>
<rect class="fact" x="150" y="784" width="16" height="16" rx="3"/>
<text class="s" x="174" y="796">Fact</text>
<rect class="step" x="230" y="784" width="16" height="16" rx="3"/>
<text class="s" x="254" y="796">Step</text>
<text class="s" x="320" y="796"><tspan class="b u">body</tspan>   Term: a name that one fact explains</text>
</svg>
