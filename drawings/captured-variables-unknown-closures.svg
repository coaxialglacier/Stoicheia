<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" role="img">
<title>Captured Variables, for a reader who does not know closures</title>
<desc>Captured Variables depends on stack frame, heap object, and closure value. Closure value depends on a closure, which depends on capture. The longest chain below Captured Variables has three unknown concepts, so it has depth 3 and is too big. Closure value, depth 2, is the concept to start with. Facts and known concepts are left out.</desc>
<style>
.bg{fill:#FFFFFF}
text{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;fill:#2C2C2A}
.h{font-size:14px;font-weight:600}
.s{font-size:12px}
.concept{fill:#EEEDFE;stroke:#534AB7;stroke-width:0.75}
.concept-t{fill:#3C3489}
.concept-s{fill:#534AB7}
.big{fill:#FCEBEB;stroke:#A32D2D;stroke-width:0.75}
.big-t{fill:#791F1F}
.big-s{fill:#A32D2D}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
.chain{stroke:#D85A30;stroke-width:1.5;fill:none}
.start{stroke-width:2.5}
@media (prefers-color-scheme: dark){
.bg{fill:#1E1E1D}
text{fill:#D3D1C7}
.concept{fill:#26215C;stroke:#AFA9EC}
.concept-t{fill:#EEEDFE}
.concept-s{fill:#CECBF6}
.big{fill:#501313;stroke:#F09595}
.big-t{fill:#FCEBEB}
.big-s{fill:#F7C1C1}
}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect class="bg" width="680" height="420"/>

<rect class="big" x="230" y="40" width="220" height="56" rx="8"/>
<text class="h big-t" x="340" y="64" text-anchor="middle">Captured variables</text>
<text class="s big-s" x="340" y="83" text-anchor="middle">Depth 3: too big</text>

<line class="arr" x1="290" y1="96" x2="142" y2="137" marker-end="url(#a)"/>
<line class="arr" x1="340" y1="96" x2="340" y2="137" marker-end="url(#a)"/>
<line class="chain" x1="400" y1="96" x2="538" y2="137" marker-end="url(#c)"/>

<rect class="concept" x="40" y="140" width="170" height="56" rx="8"/>
<text class="h concept-t" x="125" y="164" text-anchor="middle">Stack frame</text>
<text class="s concept-s" x="125" y="183" text-anchor="middle">Depth 0</text>
<rect class="concept" x="255" y="140" width="170" height="56" rx="8"/>
<text class="h concept-t" x="340" y="164" text-anchor="middle">Heap object</text>
<text class="s concept-s" x="340" y="183" text-anchor="middle">Depth 0</text>
<rect class="concept start" x="470" y="140" width="170" height="56" rx="8"/>
<text class="h concept-t" x="555" y="164" text-anchor="middle">Closure value</text>
<text class="s concept-s" x="555" y="183" text-anchor="middle">Depth 2: start here</text>

<line class="chain" x1="555" y1="196" x2="555" y2="237" marker-end="url(#c)"/>
<rect class="concept" x="470" y="240" width="170" height="56" rx="8"/>
<text class="h concept-t" x="555" y="264" text-anchor="middle">A closure</text>
<text class="s concept-s" x="555" y="283" text-anchor="middle">Depth 1</text>

<line class="chain" x1="555" y1="296" x2="555" y2="337" marker-end="url(#c)"/>
<rect class="concept" x="470" y="340" width="170" height="56" rx="8"/>
<text class="h concept-t" x="555" y="364" text-anchor="middle">Capture</text>
<text class="s concept-s" x="555" y="383" text-anchor="middle">Depth 0</text>

<rect class="concept" x="60" y="262" width="16" height="16" rx="3"/>
<text class="s" x="86" y="274">Unknown concept</text>
<rect class="big" x="60" y="300" width="16" height="16" rx="3"/>
<text class="s" x="86" y="312">Too big: Stoicheia explodes it</text>
<line class="chain" x1="56" y1="346" x2="80" y2="346" marker-end="url(#c)"/>
<text class="s" x="86" y="350">Longest chain below it: 3 unknown concepts</text>
<rect class="concept start" x="60" y="376" width="16" height="16" rx="3"/>
<text class="s" x="86" y="388">Concept to start with</text>
</svg>
