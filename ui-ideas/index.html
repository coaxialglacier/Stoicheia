<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Star Atlas</title>
<!-- Home in the constellation theme. It opens on the night sky, with the three constellations of the library: Architecture,
     Language, and Algorithms. Clicking one goes into it, and shows its skill tree. It reads the concept library, as
     archive/index.html does: library-data.js, library.js, and pages.js. heavens.js draws the night sky, skilltree.js
     draws the skill tree, galaxy.js draws the Milky Way behind it, and aurora.js, which skilltree.js calls, draws the aurora
     over each branch. -->
<link rel="stylesheet" href="sky.css">
<style>
/* The color of the sky behind everything: deep and plain on the night sky, so the three constellations bring their own color,
   and the color of the open constellation inside it, darker toward the ground of its skill tree. */
.nebula i{position:absolute;inset:0;opacity:0;transition:opacity 1.6s ease}
body[data-sky="top"] .n-top,body[data-sky="architecture"] .n-architecture,body[data-sky="language"] .n-language,body[data-sky="algorithms"] .n-algorithms{opacity:1}
.n-top{background:radial-gradient(ellipse 80% 50% at 50% 0%,rgba(36,52,120,.22),transparent 70%),radial-gradient(ellipse 120% 90% at 50% 45%,#0a1028,#04050b 82%)}
.n-language{background:
  radial-gradient(ellipse 45% 40% at 78% 38%,rgba(120,72,210,.30),transparent 70%),
  radial-gradient(ellipse 40% 35% at 40% 22%,rgba(40,90,190,.20),transparent 70%),
  radial-gradient(ellipse 45% 35% at 35% 82%,rgba(20,140,150,.18),transparent 70%),
  radial-gradient(ellipse 30% 25% at 80% 85%,rgba(200,90,140,.10),transparent 70%),
  radial-gradient(ellipse 120% 90% at 55% 45%,#0e1533,#05070f 80%)}
.n-architecture{background:
  radial-gradient(ellipse 45% 40% at 76% 38%,rgba(36,168,160,.26),transparent 70%),
  radial-gradient(ellipse 40% 35% at 40% 22%,rgba(46,104,210,.20),transparent 70%),
  radial-gradient(ellipse 45% 35% at 35% 82%,rgba(30,150,110,.15),transparent 70%),
  radial-gradient(ellipse 120% 90% at 55% 45%,#0a1a2a,#03080c 80%)}
.n-algorithms{background:
  radial-gradient(ellipse 45% 40% at 76% 38%,rgba(196,60,136,.26),transparent 70%),
  radial-gradient(ellipse 40% 35% at 40% 22%,rgba(116,58,200,.20),transparent 70%),
  radial-gradient(ellipse 45% 35% at 35% 82%,rgba(220,100,90,.11),transparent 70%),
  radial-gradient(ellipse 120% 90% at 55% 45%,#170d24,#06040b 80%)}
header .caps{color:var(--ink3)}
/* On the night sky, the large title is under the top bar, so the top bar does not show it again. Inside a constellation it does. */
body[data-sky="top"] header .brand{display:none}
/* The crumbs keep their whole width, and the search field gets narrower when the top bar is short of room. */
.crumbs{display:flex;align-items:center;gap:12px;white-space:nowrap;flex:none}
.crumbs a{color:inherit;text-decoration:none}
body:not([data-sky="top"]) #crumbSky{display:none}
.crumbs span{color:var(--gold2)}

/* Inside a constellation, the Milky Way, from galaxy.js, fills the sky behind the skill tree. It fades in and out with the tree. */
#galaxy{position:fixed;left:0;top:0;pointer-events:none;opacity:0;transition:opacity 1.4s ease;will-change:transform}
#galaxy.on{opacity:1}
#galaxy canvas{position:absolute;left:0;top:0;display:block}

/* The night sky: the nebula on a WebGL canvas, the small and bright stars on a 2D canvas over it, the figures, names, and rings
   in SVG over both, and over everything, the places that answer the pointer. */
#heavens{position:fixed;inset:0;z-index:1}
#heavens.hidden,#tree.hidden,#within.hidden,.legend.hidden{display:none}
#gas,#nebulae{position:absolute;inset:0;width:100%;height:100%}
/* figures holds what stays still, and twinkles what moves: the stars, the rings, and the lights along the lines. A browser draws an
   SVG again in full when anything in it moves, so only the light layer is drawn again every frame. */
#figures,#twinkles{position:absolute;inset:0;width:100%;height:100%;display:block;will-change:transform;pointer-events:none}
#hits{position:absolute;inset:0;width:100%;height:100%;display:block}
/* The title, Wardens of the Swift, from title.js, at the top of the sky. heavens.js sets its size and place. The first time Home
   opens, it fades in as the sky comes down. While a constellation is pointed at, it dims a little, as the other two do. */
#title{position:absolute;display:block;overflow:visible;pointer-events:none}
#title.arrive{animation:titleIn 2.4s ease-out .4s both}
@keyframes titleIn{from{opacity:0;filter:brightness(1.8)}to{opacity:1;filter:none}}
#title .wt{transition:opacity .9s}
#heavens.hovering #title .wt{opacity:.6}
/* The sky gets darker toward the edges and corners of the window. */
#heavens::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 75% 70% at 50% 46%,transparent 55%,rgba(1,2,8,.6))}
/* The first time Home opens, the sky comes down into place from above. */
#heavens.rise{animation:rise 3.2s cubic-bezier(.16,.8,.24,1) both}
@keyframes rise{from{transform:translateY(-90px) scale(1.06);opacity:0;filter:brightness(1.6)}30%{opacity:1}}
/* Going into a constellation, the night sky grows toward it and fades. Coming back out, it shrinks back from it. */
#heavens.into{transform:scale(2.7);opacity:0;filter:brightness(1.7) blur(2px)}
#heavens.going{transition:transform 1s cubic-bezier(.6,0,.9,.4),opacity .75s ease-in .1s,filter .9s}
#heavens.coming{transition:transform 1.3s cubic-bezier(.2,.7,.2,1),opacity 1s ease-out,filter 1.2s}
/* The constellation that is pointed at grows, and the others shrink and dim. At rest, the lines between the stars are bright and
   the emblem is faint. Pointed at, they swap: the emblem lights up and the lines fade, so the drawing is what the reader sees. The
   user chose this on 2026-10-21. */
.con{transition:opacity .9s,transform 1.2s cubic-bezier(.2,.7,.2,1)}
.con.hot{transform:scale(1.07)}
/* The other two constellations step back, but their stars stay bright enough to twinkle: their lines, drawings, and names fade
   most, and their stars a little. The parts that fade are the children of the emblem and the name, because those two groups
   fade in with an animation that holds their own opacity. */
#heavens.hovering .con:not(.hot){transform:scale(.96)}
.con .star,.con .emblem>g:not(.lit),.con .label>*{transition:opacity .9s}
#heavens.hovering .con:not(.hot) .star{opacity:.92}
#heavens.hovering .con:not(.hot) .emblem>g:not(.lit){opacity:.35}
#heavens.hovering .con:not(.hot) .label>*{opacity:.38}
#heavens.hovering .con:not(.hot) .eline{stroke-opacity:.32}
#heavens.hovering .con:not(.hot) .eglow{stroke-opacity:.1}
#heavens.hovering .con:not(.hot) .ebloom{stroke-opacity:.03}
#heavens.hovering .con:not(.hot) .eshade{stroke-opacity:.2}
.con .ring{opacity:0;transition:opacity 1s}
.con.hot .ring{opacity:1}
.con .travel{opacity:0;transition:opacity .6s;animation-play-state:paused}
.con.hot .travel{opacity:.5;animation-play-state:running}
/* The ring turns only while its constellation is pointed at, so that nothing hidden keeps moving. */
.ringspin{animation:ringspin 240s linear infinite;animation-play-state:paused}
.con.hot .ringspin{animation-play-state:running}
@keyframes ringspin{to{transform:rotate(360deg)}}
.con .emblem .lit{opacity:0;transition:opacity 1s}
.con.hot .emblem .lit{opacity:1}
.con .ebloom{stroke-opacity:.16;transition:stroke-opacity .9s}
.con.hot .ebloom{stroke-opacity:.05}
.con .eglow{stroke-opacity:.4;transition:stroke-opacity .9s}
.con.hot .eglow{stroke-opacity:.16}
.con .eline{stroke-opacity:.95;transition:stroke-opacity .9s}
.con.hot .eline{stroke-opacity:.58}
.con .eshade{stroke-opacity:.45;transition:stroke-opacity .9s}
.con.hot .eshade{stroke-opacity:.15}
/* The stars of the figures twinkle gently: their rays grow and shrink a little, and their halos dim to 82% and back. */
.rays{animation:rays 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes rays{0%,100%{transform:scale(.95);opacity:.9}50%{transform:scale(1.04);opacity:1}}
#twinkles .halo{animation-name:glint}
@keyframes glint{0%,100%{opacity:1}50%{opacity:.82}}
.con-name{font-family:Cinzel;font-weight:500;letter-spacing:.34em;transition:filter .6s;filter:drop-shadow(0 2px 6px rgba(0,0,0,.9))}
.con.hot .con-name{filter:drop-shadow(0 0 14px rgba(255,240,200,.55)) drop-shadow(0 2px 6px rgba(0,0,0,.9))}
.con-skill{font-weight:600;letter-spacing:0;fill:#fffaf0}
.con-sub,.con-count,.con-study{paint-order:stroke;stroke:rgba(3,5,12,.75);stroke-width:3px;stroke-linejoin:round}
.con-sub{font-family:Jost;font-size:10.5px;letter-spacing:.26em;fill:var(--ink2)}
.con-count{font-family:Jost;font-size:9.5px;letter-spacing:.24em;fill:var(--ink3)}
.con-study{font-family:Jost;font-size:9.5px;letter-spacing:.24em;fill:var(--gold)}
.ring-star{font-size:9px}
.hitcon{cursor:pointer}
/* What the constellation that is pointed at is about, at the bottom of the window, with a fine line under it. */
#about{position:fixed;left:50%;bottom:22px;z-index:2;width:min(760px,calc(100vw - 32px));transform:translate(-50%,8px);text-align:center;opacity:0;pointer-events:none;transition:opacity .5s,transform .6s cubic-bezier(.2,.8,.2,1)}
#about.on{opacity:1;transform:translate(-50%,0)}
#about p{font-size:19.5px;line-height:1.4;color:var(--ink);text-shadow:0 1px 3px #000,0 0 18px rgba(0,0,0,.9)}
#about::after{content:"";display:block;width:46%;height:1px;margin:10px auto 0;background:linear-gradient(90deg,transparent,rgba(236,230,214,.5),transparent)}
body:not([data-sky="top"]) #about,body.moving #about{opacity:0}

/* Inside a constellation: its name over the skill tree, with the way back to the night sky to its left, and under it how many
   of its ideas the reader knows. */
#within{position:fixed;top:72px;left:0;right:0;z-index:2;display:flex;flex-direction:column;align-items:center;gap:7px;pointer-events:none;transition:right .5s cubic-bezier(.2,.8,.2,1)}
#within .row{display:flex;align-items:center;gap:22px;pointer-events:auto}
#within h1{font-family:Cinzel;font-weight:500;font-size:25px;letter-spacing:.5em;margin-right:-.5em;color:var(--gold2);text-shadow:0 0 22px rgba(230,196,119,.35)}
#within .spacer{width:58px}
#conSub{color:var(--ink2);letter-spacing:.24em;text-shadow:0 1px 4px #000}
.way{position:relative;display:block;width:58px;height:24px;cursor:pointer;opacity:.7;transition:opacity .2s}
.way:hover{opacity:1}
.way svg{display:block;overflow:visible}
.way .head{transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.way:hover .head{transform:translateX(-4px);filter:drop-shadow(0 0 4px rgba(230,196,119,.75))}
.way:hover .trail{animation:westward 1.1s ease-in-out infinite;animation-delay:calc(var(--k) * .14s)}
@keyframes westward{0%,100%{opacity:.15}35%{opacity:1}}
.way b{position:absolute;top:27px;left:50%;transform:translateX(-50%);white-space:nowrap;font-family:Jost;font-weight:400;font-size:9px;letter-spacing:.24em;color:var(--gold2);opacity:0;transition:opacity .12s;pointer-events:none}
.way:hover b{opacity:1}
/* Going into a constellation, its tree grows in from far away. Going back out, it shrinks away. */
#tree,#within{transform-origin:50% 45%}
#tree.far,#within.far{transform:scale(.72);opacity:0}
#tree.coming,#within.coming{transition:transform 1.2s cubic-bezier(.2,.7,.2,1),opacity .9s ease-out}
#tree.away,#within.away{transform:scale(.6);opacity:0;transition:transform .85s cubic-bezier(.6,0,.9,.4),opacity .65s ease-in}
.empty{font-family:'EB Garamond',serif;font-style:italic;font-size:19px;fill:var(--ink2)}

/* ---------- The skill tree ----------
   It scrolls up and down, with the wheel or by dragging the sky, and fades out under the constellation's name at the top.
   It moves left while the panel of the chosen idea is open, when the idea would otherwise be under the panel. */
#tree{position:fixed;top:0;left:0;right:0;bottom:0;z-index:1;overflow:auto;cursor:grab;user-select:none;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,transparent 92px,#000 178px);mask-image:linear-gradient(180deg,transparent 0,transparent 92px,#000 178px);
}
#tree.dragging{cursor:grabbing}
#treeIn{position:relative;margin:0 auto;transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.tsvg{position:absolute;left:0;top:0;display:block;overflow:visible}
/* The aurora over each branch, from aurora.js, is still. It fades in when the tree opens. */
.aurora-gl{position:absolute;left:0;top:0;display:block;pointer-events:none}
.aurora-gl.fadein{animation:aurIn 2.4s ease-out .2s both}
/* Without WebGL, the older aurora rises when the tree opens, and then sways slowly. */
.aurora{position:absolute;pointer-events:none;mix-blend-mode:screen;transform-origin:50% 100%;animation-name:aurIn,sway;animation-timing-function:ease-out,ease-in-out;animation-iteration-count:1,infinite;animation-direction:normal,alternate;animation-fill-mode:both,none}
@keyframes aurIn{from{opacity:0}}
@keyframes sway{0%{transform:skewX(-2.6deg) scaleY(.94)}100%{transform:skewX(2.4deg) scaleY(1.05)}}
.ground.rise{animation:groundRise 1.7s cubic-bezier(.2,.7,.2,1) both}
@keyframes groundRise{from{transform:translateY(70px);opacity:0}}
.bn{font-family:Cinzel;font-size:15px;font-weight:500;letter-spacing:.32em;fill:var(--gold2);filter:drop-shadow(0 0 10px rgba(230,196,119,.35))}
.bcount{font-family:Jost;font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;fill:var(--ink3)}
.tnum{font-family:Cinzel;font-size:12px;fill:rgba(185,179,164,.45)}
.tnum.lit{fill:var(--gold2)}
.tword{font-family:Jost;font-size:9px;letter-spacing:.32em;fill:var(--ink3)}
/* An idea: its star, its name under it, and the socket under its name. */
.tsvg .node{cursor:pointer;transition:opacity .5s}
.node .body,.node .art,.node .lock,.node .lockfx,.node .shackle{transform-box:fill-box;transform-origin:center}
.node .body{transition:transform .35s cubic-bezier(.2,.9,.3,1.3)}
.node.hover .body,.node.chosen .body{transform:scale(1.14)}
.node .name{font-family:Jost;font-size:13px;font-weight:500;letter-spacing:.12em;paint-order:stroke;stroke:#03050c;stroke-width:5px;stroke-linejoin:round;pointer-events:none;transition:fill .3s}
.s-known .name{fill:#fbecc4}
.s-ready .name{fill:#f4f9ff}
.s-locked .name{fill:#aeabc4}
.s-studying .name{fill:var(--gold2);font-weight:500}
.s-planned .name{fill:#9896b4;font-size:12px;font-weight:400}
.node.hover .name{fill:var(--gold2)}
.node .sub{font-family:Jost;font-size:9px;letter-spacing:.2em;fill:var(--gold);paint-order:stroke;stroke:#05070f;stroke-width:3px}
.pulse{animation:pulse 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{opacity:.5;transform:scale(.82)}50%{opacity:1;transform:scale(1.08)}}
.spin,.turn,.spinslow{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
.turn{animation-duration:70s}
.spinslow{animation-duration:110s}
@keyframes spin{to{transform:rotate(360deg)}}
.node.hover .lock path,.node.hover .lock .shackle{stroke:#e6c477}
.lock{transform-origin:50% 0}
.lock.rattle{animation:rattle .5s}
@keyframes rattle{20%,60%{transform:rotate(-14deg)}40%,80%{transform:rotate(12deg)}}
/* A lock that opens: its shackle lifts and turns, then the whole lock grows and fades, and the star that is ready lights. */
.lockfx{animation:lockOpen 1.05s ease-in .15s both}
.lockfx .shackle{transform-origin:100% 100%;animation:shackle .45s cubic-bezier(.3,1.6,.5,1) .2s both}
@keyframes shackle{to{transform:translate(1.6px,-3.2px) rotate(32deg)}}
@keyframes lockOpen{0%,55%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.9)}}
.art.unlocking{opacity:0;animation:ignite .8s cubic-bezier(.2,.9,.3,1.3) 1s forwards}
.art.learned{animation:learned 1.2s ease-out}
@keyframes learned{0%{transform:scale(.3);filter:brightness(3)}45%{transform:scale(1.4)}100%{transform:scale(1);filter:none}}
/* Lines. Light runs up a line into an idea that is ready, and up every line of the path to the chosen idea. */
.tsvg .edge{transition:opacity .5s}
.edge .flow{display:none}
.edge .flow.on,.edge.onpath .flow{display:inline}
.edge .flow.late{opacity:0;animation:flow 2.6s linear infinite,fade 1s ease-out var(--late) forwards}
.edge.hot .line{stroke-width:2}
.edge.k-dark.hot .line,.edge.k-plan.hot .line{stroke:rgba(205,210,245,.6)}
.edge.onpath .line{stroke:#e6c477;stroke-opacity:.95;stroke-width:1.7}
/* With an idea chosen, everything that is not on its path dims. */
.tsvg.focus .node:not(.onpath):not(.start):not(.chosen){opacity:.3}
.tsvg.focus .edge:not(.onpath){opacity:.14}
.num text{font-family:Cinzel;font-size:10.5px;fill:#fbe7b0;letter-spacing:.06em}

/* The panel of the chosen idea, at the right of the tree. */
#skill{position:fixed;top:138px;right:22px;z-index:4;width:376px;max-height:calc(100vh - 230px);overflow-y:auto;padding:22px 26px 24px;opacity:0;transform:translateX(34px);pointer-events:none;transition:opacity .35s,transform .55s cubic-bezier(.2,.8,.2,1)}
#skill.on{opacity:1;transform:none;pointer-events:auto}
body.skill-open #within{right:410px}
.sk-where{display:flex;align-items:center;gap:10px}
.sk-where i{width:7px;height:7px;transform:rotate(45deg);background:var(--c);box-shadow:0 0 8px var(--c)}
#skill h2{font-family:Cinzel;font-weight:500;font-size:27px;line-height:1.2;letter-spacing:.04em;color:var(--gold2);margin:9px 0 10px;text-shadow:0 0 18px rgba(230,196,119,.35)}
.sk-state{display:inline-flex;align-items:center;gap:8px;font-family:Jost;font-size:10px;letter-spacing:.24em;text-transform:uppercase;padding:5px 13px 5px 9px;border-radius:999px;border:1px solid}
.sk-state svg,.sk-item svg{flex:none;overflow:visible}
.sk-state.known,.sk-state.studying{color:var(--gold2);border-color:rgba(230,196,119,.5);background:rgba(230,196,119,.08)}
.sk-state.ready{color:#e6f4ff;border-color:rgba(154,217,255,.5);background:rgba(154,217,255,.07)}
.sk-state.locked{color:#aaa6c0;border-color:rgba(165,161,187,.35);background:rgba(165,161,187,.05)}
.sk-state.planned{color:var(--ink3);border-style:dashed;border-color:rgba(126,124,144,.45)}
.sk-first{font-size:18px;line-height:1.5;color:var(--ink);margin-top:14px}
.sk-h{margin:22px 0 4px;color:var(--gold)}
.sk-item{display:flex;align-items:center;gap:12px;padding:8px 4px;border-bottom:1px solid rgba(230,196,119,.08);cursor:pointer;font-family:Jost;font-size:14px;letter-spacing:.03em;color:var(--ink);transition:color .2s}
.sk-item:hover{color:var(--gold2)}
.sk-item small{margin-left:auto;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink3);white-space:nowrap}
.sk-acts{display:flex;align-items:center;gap:16px;margin-top:24px;flex-wrap:wrap}
.sk-acts .iknow{margin-top:0}
.sk-note{font-size:15px;font-style:italic;color:var(--ink3);line-height:1.45;margin-top:18px}
#skill .lead{margin-top:20px}
#skill .path{margin-top:16px}
#skill .step h3{cursor:pointer}
#skill .step h3:hover{color:var(--gold2)}
.lead{font-size:17.5px;line-height:1.45;color:var(--ink)}
.lead b{font-weight:500;color:var(--gold2)}
.path{position:relative;margin-top:14px;padding-left:44px}
.path::before{content:"";position:absolute;left:15px;top:14px;bottom:30px;width:1px;background:linear-gradient(var(--gold),rgba(230,196,119,.15))}
.step{position:relative;padding-bottom:20px;transition:opacity .4s,max-height .5s .25s,padding .5s .25s;max-height:400px;overflow:hidden}
.step.gone{opacity:0;max-height:0;padding-bottom:0}
.num{position:absolute;left:-44px;top:-2px;width:31px;height:31px;display:grid;place-items:center;font-family:Cinzel;font-size:12px;color:var(--gold2);background:radial-gradient(circle,rgba(230,196,119,.30),rgba(6,9,22,.95) 70%);border:1px solid var(--goldDim);transform:rotate(45deg)}
.num span{transform:rotate(-45deg)}
.step.now .num{border-color:var(--gold);box-shadow:0 0 14px rgba(230,196,119,.55)}
.step h3{font-family:Cinzel;font-weight:500;font-size:16.5px;color:var(--ink);letter-spacing:.03em}
.step .view{font-family:Jost;text-transform:uppercase;letter-spacing:.18em;font-size:9.5px;color:var(--gold);margin:3px 0 4px}
.step p{font-size:15.5px;color:var(--ink2);line-height:1.4}
.why{margin-top:8px;padding:8px 12px;border-left:1px solid var(--gold);background:linear-gradient(90deg,rgba(230,196,119,.08),transparent);font-size:14.5px;color:var(--ink2);line-height:1.4}
.why .caps{color:var(--gold);font-size:9.5px;display:block;margin-bottom:2px}
.iknow{margin-top:8px;font-family:Jost;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);border:1px solid rgba(141,146,168,.3);padding:4px 10px;display:inline-block;border-radius:20px;cursor:pointer;transition:all .2s}
.iknow:hover{color:var(--gold2);border-color:var(--gold);box-shadow:0 0 12px rgba(230,196,119,.3)}
.res{display:flex;align-items:center;gap:12px;padding:9px 4px;border-bottom:1px solid rgba(230,196,119,.08);cursor:pointer;font-family:Jost;font-size:14px;letter-spacing:.03em;color:var(--ink)}
.res:hover{color:var(--gold2)}
.res small{margin-left:auto;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink3)}
.res .d{width:10px;height:10px;border-radius:50%;flex:none;background:radial-gradient(circle,#fff 0 28%,rgba(195,176,255,.5) 40%,transparent 70%)}
.res .d.known{background:none;border:1px dashed var(--known)}
.res .d.ready{background:radial-gradient(circle,#fff 0 28%,rgba(154,217,255,.7) 40%,transparent 70%)}

/* When the reader learns an idea, the ideas it unlocks are named under the constellation's name for a moment. */
#unlock{margin-top:14px;text-align:center;opacity:0;transform:translateY(-8px);pointer-events:none;transition:opacity .6s,transform .8s cubic-bezier(.2,.8,.2,1)}
#unlock.on{opacity:1;transform:none}
#unlock .caps{color:var(--gold);letter-spacing:.42em;display:flex;align-items:center;justify-content:center;gap:14px}
#unlock .caps::before,#unlock .caps::after{content:"";width:70px;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
#unlock .caps::after{transform:scaleX(-1)}
#unlock p{font-family:Cinzel;font-size:22px;letter-spacing:.08em;color:var(--gold2);margin-top:6px;text-shadow:0 0 22px rgba(230,196,119,.5),0 1px 4px #000}

/* The key to the tree's stars, on the ground under the names of its branches, so it never covers an idea. */
.legend{position:absolute;left:50%;bottom:14px;z-index:2;transform:translateX(-50%);display:flex;gap:22px;align-items:center;padding:10px 22px;white-space:nowrap;pointer-events:none}
.legend div{display:flex;align-items:center;gap:8px}
.legend svg{width:22px;height:22px;overflow:visible}
/* The top bar ends with a search field, the harp, and the user icon, which is always in the far top-right corner.
   The search field is a rounded capsule with a fine gold line all the way round, on a pool of darker sky. */
.skysearch{display:flex;align-items:center;gap:10px;width:min(300px,30vw);height:34px;padding:0 18px;border:1px solid rgba(230,196,119,.22);border-radius:999px;background:rgba(5,7,18,.55);cursor:text;transition:border-color .25s,background .25s,box-shadow .25s}
.skysearch:hover{border-color:rgba(230,196,119,.4)}
.skysearch:focus-within{border-color:rgba(230,196,119,.6);background:rgba(8,11,26,.85);box-shadow:0 0 18px rgba(230,196,119,.16)}
.skysearch b{color:var(--gold);font-weight:400;font-size:12px;animation:tw 1.8s ease-in-out infinite}
.skysearch input{all:unset;flex:1;min-width:0;font-family:'EB Garamond',serif;font-style:italic;font-size:15.5px;line-height:20px;color:var(--ink);caret-color:var(--gold)}
.skysearch input::placeholder{color:var(--ink3)}
#skyResults{position:fixed;top:70px;right:22px;width:min(400px,calc(100vw - 32px));z-index:5;padding:16px 24px;display:none}
#skyResults.on{display:block;animation:fade .3s}

<script>
// With ?place=<constellation> in the address, such as index.html?place=algorithms, Home also loads place.js, which places the
// stars of that figure over its picture. The site does not publish place.js.
if (new URLSearchParams(location.search).has('place')) document.body.appendChild(Object.assign(document.createElement('script'), { src: 'place.js' }));
</script>
<script>
// Home in the constellation theme. Everything on it comes from the concept library, through pages.js: the constellations and
// their areas, the ideas and what they need, what the reader knows, and the study in progress. heavens.js draws the night sky,
// and skilltree.js draws the skill tree inside a constellation.
const { el } = Sky;
const heavens = document.getElementById('heavens'), within = document.getElementById('within'), legend = document.querySelector('.legend');
const tree = document.getElementById('tree'), skill = document.getElementById('skill');
// Which view is open: null for the night sky, with all three constellations, or the id of the constellation the reader went into.
// It is in the address, as index.html?constellation=language, so a reload, the browser's Back button, and the way back from
// Expand to Parts and Graph and Page all open the same view. The way back from those pages also names the idea the reader
// came from, as &skill=generics, and the tree opens with that idea chosen.
const askedSky = () => { const c = new URLSearchParams(location.search).get('constellation'); return CONSTELLATIONS.some(k => k.id === c) ? c : null; };
const askedSkill = () => { const s = new URLSearchParams(location.search).get('skill'); return s && (IDEAS[s] || PLANNED[s]) ? s : null; };
let sky = askedSky(), pending = askedSkill();

const ROMAN = n => ['', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI', 'XII', 'XIII', 'XIV', 'XV'][n] || String(n);
const nameOf = id => (IDEAS[id] || PLANNED[id]).name;
const firstOf = id => (IDEAS[id] || PLANNED[id]).first;
const skillArea = id => (IDEAS[id] || PLANNED[id]).area;

// ---------- The panel of the chosen idea ----------
// At the right of the tree: the chosen idea's branch and tier, its name, where the reader stands with it, and its first fact.
// An idea the reader knows, or is ready to learn, lists what it needs. A locked idea shows the path to it instead, in teaching
// order, with "I know this" on each step. Every idea lists what it leads to. Examine opens Expand to Parts on the idea, as a
// second click on its star does. A locked idea cannot be opened: it offers the first idea on its path.
const STATE_NAME = { known: 'Known', ready: 'Ready to learn', locked: 'Locked', studying: 'Studying', planned: 'Planned' };
function stateIcon(st, color) {
  const lock = '<path d="M-3.4 -1.6V-4.4A3.4 3.4 0 0 1 3.4 -4.4V-1.6" fill="none" stroke="#9c97b4" stroke-width="1.5"/><path d="M-5.4 -1.8H5.4V2.2C5.4 5.2 2.7 7.1 0 8.3C-2.7 7.1 -5.4 5.2 -5.4 2.2Z" fill="#1b1c2c" stroke="#9c97b4" stroke-width=".9"/><circle cy="1.3" r="1.1" fill="#04050b"/>';
  const inner = {
    known: '<circle r="6" fill="#2a200a" stroke="#e6c477" stroke-width="1.2"/><path d="M0 -4L1 -1L4 0L1 1L0 4L-1 1L-4 0L-1 -1Z" fill="#fff3cf"/>',
    ready: `<circle r="6" fill="#060916" stroke="${color}" stroke-width="1.3"/><circle r="2.2" fill="#fff"/>`,
    locked: `<g transform="scale(.85)">${lock}</g>`,
    studying: '<circle r="6.5" fill="none" stroke="#e6c477" stroke-dasharray="1 1.5"/><path d="M0 -4.5L1 -1L4.5 0L1 1L0 4.5L-1 1L-4.5 0L-1 -1Z" fill="#fbe7b0"/>',
    planned: '<circle r="4.5" fill="none" stroke="rgba(200,200,235,.55)" stroke-dasharray="1.2 2"/>',
  }[st];
  return `<svg width="16" height="16" viewBox="-8 -8 16 16">${inner}</svg>`;
}
function skillPanel(id, P) {
  document.body.classList.toggle('skill-open', !!id);
  skill.classList.toggle('on', !!id);
  aside(id);
  if (!id) return;
  const N = SkillTree.node(id), st = SkillTree.stateOf(id), color = a => SkillTree.COLOR[a];
  const item = i => `<div class="sk-item" data-pick="${i}">${stateIcon(SkillTree.stateOf(i), color(skillArea(i)))}<span>${nameOf(i)}</span>` +
    (skillArea(i) !== N.area ? `<small>${areaName(skillArea(i))}</small>` : '') + `</div>`;
  let html = `<div class="caps sk-where" style="--c:${color(N.area)}"><i></i>${areaName(N.area)} · Tier ${N.tier + 1}</div>
    <h2>${N.name}</h2><span class="sk-state ${st}">${stateIcon(st, color(N.area))}${st === 'studying' ? stateText(id) : STATE_NAME[st]}</span>
    <p class="sk-first">${Library.escapeHTML(N.first)}</p>`;
  const needs = needsOf(id);
  if (st === 'known' || st === 'ready') {
    html += needs.length ? `<div class="caps sk-h">It needs</div>${needs.map(item).join('')}` : `<p class="sk-note">It needs no other idea, so it stands on the ground.</p>`;
  } else {
    const before = P.steps.filter(s => s.id !== id);
    const count = new Set(before.map(s => s.id)).size;
    html += `<p class="lead">${count ? `To ${st === 'studying' ? 'finish' : 'unlock'} <b>${N.name}</b>, you learn <b>${count === 1 ? '1 idea' : count + ' ideas'}</b> on the way, in this order.` : `You know everything <b>${N.name}</b> needs.`}</p>`;
    html += `<div class="path">` + P.steps.map((s, i) => {
      // The reason for a step: the first later step that needs it, and why.
      const later = P.steps.slice(i + 1).find(t => t.id !== s.id && needsOf(t.id).includes(s.id));
      const reason = later && IDEAS[later.id] ? why(later.id, s.id) : '';
      return `<div class="step ${i === 0 ? 'now' : ''}"><div class="num"><span>${ROMAN(i + 1)}</span></div><h3 data-pick="${s.id}">${nameOf(s.id)}</h3>` +
        (VIEW_LABEL[s.view] ? `<div class="view">${VIEW_LABEL[s.view]}</div>` : '') +
        `<p>${Library.escapeHTML(firstOf(s.id))}</p>` +
        (reason ? `<div class="why"><span class="caps">Needed for ${nameOf(later.id).toLowerCase()}</span>${Library.textHTML(reason)}</div>` : '') +
        (s.id !== id && !PLANNED[s.id] ? `<span class="iknow" data-know="${s.id}">I know this</span>` : '') + `</div>`;
    }).join('') + `</div>`;
  }
  const leads = [...Object.keys(IDEAS), ...Object.keys(PLANNED)].filter(k => needsOf(k).includes(id));
  if (leads.length) html += `<div class="caps sk-h">It leads to</div>${leads.map(item).join('')}`;
  const star = text => `<i>✦</i>${text}<i>✦</i>`;
  if (st === 'known') html += `<div class="sk-acts"><button class="ybtn" data-act="examine">${star('Examine')}</button></div>`;
  if (st === 'ready') html += `<div class="sk-acts"><button class="ybtn" data-act="examine">${star('Examine')}</button><span class="iknow" data-know="${id}">I know this</span></div>`;
  if (st === 'studying') html += `<div class="sk-acts"><button class="ybtn" data-act="examine">${star('Continue')}</button></div>`;
  if (st === 'locked' && P.steps.length) html += `<div class="sk-acts"><button class="ybtn" data-pick="${P.steps[0].id}">${star('Start with ' + nameOf(P.steps[0].id))}</button></div>`;
  if (st === 'planned') html += `<p class="sk-note">This idea has no entry in the library yet. What it needs is a first guess, until its entry is written and checked.</p>`;
  skill.innerHTML = html;
  skill.scrollTop = 0;
}
// While the panel is open, the tree moves left when the chosen idea would be under the panel, and moves back when it closes.
let shifted = 0;
function aside(id) {
  const inner = document.getElementById('treeIn'), p = id && SkillTree.where(id), room = innerWidth - 520;
  const next = p && p.x - shifted > room ? Math.round(room - (p.x - shifted)) : 0;
  if (next === shifted) return;
  shifted = next;
  inner.style.transform = shifted ? `translateX(${shifted}px)` : '';
}
SkillTree.onSelect = skillPanel;
// After the tree is drawn, the key goes under it, and the Milky Way behind it is sized for how far the tree can scroll.
SkillTree.afterDraw = () => { document.getElementById('treeIn').appendChild(legend); fitGalaxy(); };
const fitGalaxy = () => { Galaxy.size(tree.scrollWidth - tree.clientWidth, tree.scrollHeight - tree.clientHeight); tilt(); };
// As the tree scrolls up, the Milky Way moves down a quarter as far, as the sky does when a person tilts their head up.
const tilt = () => Galaxy.view(tree.scrollLeft, tree.scrollTop, tree.scrollHeight - tree.clientHeight);
tree.addEventListener('scroll', tilt, { passive: true });
SkillTree.onExamine = (id, x, y) => Sky.go(`expand.html?root=${id}`, x, y);
skill.addEventListener('click', e => {
  const pick = e.target.closest('[data-pick]'), know = e.target.closest('[data-know]'), act = e.target.closest('[data-act]');
  if (know) {
    const step = know.closest('.step');
    if (step) step.classList.add('gone');
    setTimeout(() => announce(know.dataset.know, SkillTree.learn(know.dataset.know)), step ? 380 : 0);
  } else if (pick) choose(pick.dataset.pick);
  else if (act && act.dataset.act === 'examine') {
    const id = SkillTree.selected(), p = SkillTree.where(id);
    Sky.go(`expand.html?root=${id}`, p ? p.x : innerWidth / 2, p ? p.y : innerHeight / 2);
  }
});
// After "I know this", the ideas it unlocked are named under the constellation's name, or the idea is said to be known.
let unlockTimer = 0;
function announce(id, unlocked) {
  const box = document.getElementById('unlock');
  box.querySelector('.caps').textContent = unlocked.length ? 'Unlocked' : 'Known';
  box.querySelector('p').textContent = unlocked.length ? unlocked.map(nameOf).join(' · ') : nameOf(id);
  clearTimeout(unlockTimer);
  box.classList.remove('on'); void box.offsetWidth;
  setTimeout(() => box.classList.add('on'), unlocked.length ? 700 : 200);
  unlockTimer = setTimeout(() => box.classList.remove('on'), 3600);
  progress();
}
// Under the constellation's name: how many of its ideas the reader knows, and how many more are planned.
function progress() {
  const ids = constellationIdeas(sky), planned = Object.keys(PLANNED).filter(id => constellationOf(PLANNED[id].area) === sky).length;
  document.getElementById('conSub').textContent = ids.length || planned
    ? `${ids.filter(id => KNOWN.has(id)).length} of ${ids.length} ideas known` + (planned ? ` · ${planned} planned` : '') : '';
}

// The ideas whose name or first fact has the typed text in it.
function matching(text) { return Object.keys(IDEAS).filter(id => IDEAS[id].name.toLowerCase().includes(text) || IDEAS[id].first.toLowerCase().includes(text)); }
// Escape lets go of the chosen idea. With nothing chosen, Escape inside a constellation goes back out to the night sky.
addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  // An open panel under the harp or the user icon closes first. sky.js closes it, and it is still fading out here.
  if (Sky.panelShown()) return;
  if (sky && SkillTree.selected()) SkillTree.focus(null);
  else if (sky) travelTo(null);
});

// ---------- The search field in the top bar ----------
// Typing lists the ideas that match under the field, each with the constellation it is in. Choosing one goes into that
// constellation, where its tree opens with the idea chosen.
const sq = document.getElementById('sq'), skyResults = document.getElementById('skyResults');
function skySearch() {
  const text = sq.value.trim().toLowerCase();
  if (!text) { skyResults.classList.remove('on'); return; }
  const hits = matching(text);
  const dot = id => KNOWN.has(id) ? 'known' : isReady(id) ? 'ready' : '';
  skyResults.innerHTML = `<div class="caps" style="margin-bottom:4px">${hits.length ? 'Ideas that match' : 'No idea matches yet'}</div>` +
    hits.map(id => `<div class="res" data-goal="${id}"><span class="d ${dot(id)}"></span>${IDEAS[id].name}<small>${constellationName(constellationOf(IDEAS[id].area))}</small></div>`).join('');
  skyResults.querySelectorAll('[data-goal]').forEach(r => r.onclick = () => pickFromSky(r.dataset.goal));
  // The list's right edge is under the search field's right edge.
  skyResults.style.right = Math.max(16, innerWidth - document.querySelector('.skysearch').getBoundingClientRect().right) + 'px';
  skyResults.classList.add('on');
}
function clearSkySearch() { sq.value = ''; skyResults.classList.remove('on'); }
function pickFromSky(id) { clearSkySearch(); sq.blur(); choose(id); }
sq.addEventListener('input', skySearch);
sq.addEventListener('focus', skySearch);
sq.addEventListener('keydown', e => {
  if (e.key === 'Enter') { const first = skyResults.querySelector('.res'); if (first) pickFromSky(first.dataset.goal); }
  if (e.key === 'Escape') { clearSkySearch(); sq.blur(); e.stopPropagation(); }
});
// A click anywhere outside the field and its list closes the list, and keeps what was typed.
document.addEventListener('pointerdown', e => { if (!e.target.closest('.skysearch, #skyResults')) skyResults.classList.remove('on'); });

// Choosing an idea: on the tree of its constellation, it is chosen at once. An idea in another constellation, or chosen on the
// night sky, first goes into the constellation it is in.
function choose(id) {
  const c = constellationOf(skillArea(id));
  if (c !== sky) { pending = id; travelTo(c); return; }
  SkillTree.select(id);
}

// ---------- Going into a constellation, and back out to the night sky ----------
// A move to another view, from the middle of the constellation on the night sky, or from the middle of the tree inside one:
// the view that is open moves away, the stars stretch, and the new view arrives. push is false when the browser's Back or
// Forward button made the move, because the address has already changed.
let moving = false;
function travelTo(next, push = true) {
  if (moving || next === sky) return;
  moving = true; Sky.hide(); Sky.hint.cancel();
  document.body.classList.add('moving');
  const prev = sky;
  let x = innerWidth / 2, y = innerHeight * .45;
  if (!prev) {
    ({ x, y } = Heavens.centerOf(next));
    heavens.style.transformOrigin = `${x}px ${y}px`;
    heavens.classList.add('going', 'into');
  } else { tree.classList.add('away'); within.classList.add('away'); skillPanel(null); }
  Sky.travel(x, y, () => {
    sky = next;
    if (push) history.pushState(null, '', sky ? `?constellation=${sky}` : location.pathname);
    showView(prev);
    document.body.classList.remove('moving');
    moving = false;
  }, next ? 1 : -1);
}
addEventListener('popstate', () => { pending = askedSkill(); travelTo(askedSky(), false); });
document.getElementById('backSky').onclick = () => travelTo(null);
// The title in the top bar shows only inside a constellation, and leads back out to the night sky.
Sky.onBrand = () => { if (sky) travelTo(null); };
Heavens.onEnter = id => travelTo(id);
// A skill in the user icon's panel goes into its constellation, as clicking the constellation does.
You.onSkill = id => travelTo(id);

// Shows the open view. prev is the view the reader came from: the night sky pulls back from the constellation they left, and a
// constellation's tree grows in from far away, lighting up from the ground to the top. Only one of the two is drawn at a time,
// so their SVG filters never share a page.
function showView(prev, first) {
  document.body.dataset.sky = sky || 'top';
  const here = sky && CONSTELLATIONS.find(c => c.id === sky);
  // The top bar names the view: The constellations on the night sky, and, inside one, its name, such as Language constellation.
  document.getElementById('crumbHere').textContent = here ? here.name + ' constellation' : '';
  // Inside a constellation, the Milky Way replaces the sky's small stars, which show only while they stretch in a move.
  Galaxy.show(!!sky); Sky.quiet(!!sky && Galaxy.ok);
  if (!sky) {
    skillPanel(null);
    tree.classList.add('hidden'); within.classList.add('hidden'); legend.classList.add('hidden');
    heavens.classList.remove('hidden', 'going');
    Heavens.draw(constellationInfo(), first);
    Heavens.start();
    if (prev) {
      const c = Heavens.centerOf(prev);
      heavens.style.transformOrigin = `${c.x}px ${c.y}px`;
      heavens.classList.add('into'); void heavens.offsetWidth;
      heavens.classList.add('coming'); heavens.classList.remove('into');
      setTimeout(() => heavens.classList.remove('coming'), 1400);
    } else heavens.classList.remove('into');
    return;
  }
  Heavens.stop(); heavens.classList.add('hidden'); heavens.classList.remove('into', 'going', 'coming');
  document.getElementById('conName').textContent = here.name.toUpperCase();
  progress();
  [tree, within].forEach(e => {
    e.classList.remove('hidden', 'away', 'coming');
    if (first) return;
    e.classList.add('far'); void e.offsetWidth;
    e.classList.add('coming'); e.classList.remove('far');
    setTimeout(() => e.classList.remove('coming'), 1300);
  });
  SkillTree.draw(sky, { intro: true });
  legend.classList.toggle('hidden', !SkillTree.model().ids.length);
  const id = pending; pending = null;
  tree.scrollTop = tree.scrollHeight;
  fitGalaxy();
  // In a window narrower than the tree, the tree opens across from the chosen idea, or from the highest idea that is ready.
  const across = id && SkillTree.has(id) ? id : frontier();
  tree.scrollLeft = across ? SkillTree.where(across).x + tree.scrollLeft - tree.clientWidth / 2 : (tree.scrollWidth - tree.clientWidth) / 2;
  if (id && SkillTree.has(id)) setTimeout(() => SkillTree.select(id), 900);
  else tour();
}
// The highest idea on the open tree that the reader can learn now.
function frontier() {
  const ready = SkillTree.model().ids.filter(id => SkillTree.stateOf(id) === 'ready');
  return ready.sort((a, b) => SkillTree.where(a).y - SkillTree.where(b).y)[0] || null;
}

// ---------- The first look at a tree ----------
// When a tree is taller than the window, the view starts on the ground, rises with the stars as they light up, to the top of
// the tree, and comes back down to the highest idea the reader can learn now. Scrolling, dragging, or a key stops it.
let touring = 0;
function tour() {
  cancelAnimationFrame(touring);
  const max = tree.scrollHeight - tree.clientHeight;
  if (max < 120) return;
  const next = frontier(), top = next && SkillTree.where(next).y + tree.scrollTop;
  const rest = next ? Math.max(0, Math.min(max, top - tree.clientHeight * .55)) : max;
  const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const legs = [[0, 350, max, max], [350, 2700, max, 0], [2700, 3300, 0, 0], [3300, 4800, 0, rest]];
  const t0 = performance.now();
  const step = now => {
    const t = now - t0, leg = legs.find(l => t < l[1]);
    if (!leg) { tree.scrollTop = rest; return; }
    tree.scrollTop = leg[2] + (leg[3] - leg[2]) * ease((t - leg[0]) / (leg[1] - leg[0]));
    touring = requestAnimationFrame(step);
  };
  touring = requestAnimationFrame(step);
}
['wheel', 'pointerdown', 'keydown', 'touchstart'].forEach(ev => addEventListener(ev, () => cancelAnimationFrame(touring), { passive: true }));
// A new size of window draws the tree again for it, where the reader was.
let resizing = 0;
addEventListener('resize', () => { clearTimeout(resizing); resizing = setTimeout(() => { if (sky) SkillTree.redraw(); }, 150); });


// The night sky comes down into place when the page can be seen, which is after the loading view of sound.html lifts.
Sky.whenShown(() => showView(null, true));
</script>
