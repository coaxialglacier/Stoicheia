<svg xmlns="http://www.w3.org/2000/svg" width="680" height="576" viewBox="0 0 680 576" role="img">
<title>Captured Variables, for a reader who knows closures</title>
<desc>Captured Variables has two steps and one fact of its own, and depends on three unknown concepts: stack frame, heap object, and closure value. Each of those has two facts. Closure value explains the term context. Below them are four known concepts: function call, memory address, pointer, and a closure.</desc>
<style>
.bg{fill:#FFFFFF}
text{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;fill:#2C2C2A}
.h{font-size:14px;font-weight:600}
.s{font-size:12px}
.b{font-weight:600}
.u{text-decoration:underline}
.concept{fill:#EEEDFE;stroke:#534AB7;stroke-width:0.75}
.concept-t{fill:#3C3489}
.concept-s{fill:#534AB7}
.fact{fill:#E1F5EE;stroke:#0F6E56;stroke-width:0.75}
.fact-t{fill:#085041}
.step{fill:#FAECE7;stroke:#993C1D;stroke-width:0.75}
.step-t{fill:#712B13}
.known{fill:none;stroke:#888780;stroke-width:0.75;stroke-dasharray:4 3}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
.dash{stroke-dasharray:4 3}
@media (prefers-color-scheme: dark){
.bg{fill:#1E1E1D}
text{fill:#D3D1C7}
.concept{fill:#26215C;stroke:#AFA9EC}
.concept-t{fill:#EEEDFE}
.concept-s{fill:#CECBF6}
.fact{fill:#04342C;stroke:#5DCAA5}
.fact-t{fill:#E1F5EE}
.step{fill:#4A1B0C;stroke:#F0997B}
.step-t{fill:#FAECE7}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="bg" width="680" height="576"/>

<rect class="concept" x="40" y="30" width="600" height="150" rx="12"/>
<text class="h concept-t" x="60" y="65">Captured variables</text>
<text class="s concept-s" x="60" y="86">For a reader who</text>
<text class="s concept-s" x="60" y="104">knows closures</text>

<rect class="step" x="250" y="46" width="370" height="34" rx="4"/>
<text class="s step-t" x="264" y="67">var count = 0 puts count in a box on the heap</text>
<rect class="step" x="250" y="88" width="370" height="34" rx="4"/>
<text class="s step-t" x="264" y="109">makeCounter(step: 2) returns</text>
<rect class="fact" x="250" y="130" width="370" height="34" rx="4"/>
<text class="s fact-t" x="264" y="151">The context holds the address of the box</text>

<line class="arr" x1="130" y1="180" x2="130" y2="232" marker-end="url(#a)"/>
<line class="arr" x1="340" y1="180" x2="340" y2="232" marker-end="url(#a)"/>
<line class="arr" x1="550" y1="180" x2="550" y2="232" marker-end="url(#a)"/>
<text class="s" x="350" y="210">depends on</text>

<rect class="concept" x="40" y="234" width="180" height="150" rx="12"/>
<text class="h concept-t" x="130" y="270" text-anchor="middle">Stack frame</text>
<rect class="fact" x="54" y="290" width="152" height="40" rx="4"/>
<text class="s fact-t" x="130" y="306" text-anchor="middle">Made for each</text>
<text class="s fact-t" x="130" y="322" text-anchor="middle">function call</text>
<rect class="fact" x="54" y="336" width="152" height="40" rx="4"/>
<text class="s fact-t" x="130" y="352" text-anchor="middle">Removed when its</text>
<text class="s fact-t" x="130" y="368" text-anchor="middle">call returns</text>

<rect class="concept" x="250" y="234" width="180" height="150" rx="12"/>
<text class="h concept-t" x="340" y="270" text-anchor="middle">Heap object</text>
<rect class="fact" x="264" y="290" width="152" height="40" rx="4"/>
<text class="s fact-t" x="340" y="306" text-anchor="middle">Memory on the heap,</text>
<text class="s fact-t" x="340" y="322" text-anchor="middle">found by its address</text>
<rect class="fact" x="264" y="336" width="152" height="40" rx="4"/>
<text class="s fact-t" x="340" y="352" text-anchor="middle">Stays while something</text>
<text class="s fact-t" x="340" y="368" text-anchor="middle">refers to it</text>

<rect class="concept" x="460" y="234" width="180" height="150" rx="12"/>
<text class="h concept-t" x="550" y="270" text-anchor="middle">Closure value</text>
<rect class="fact" x="474" y="290" width="152" height="40" rx="4"/>
<text class="s fact-t" x="550" y="306" text-anchor="middle">The <tspan class="b u">context</tspan> holds what</text>
<text class="s fact-t" x="550" y="322" text-anchor="middle">the closure captured</text>
<rect class="fact" x="474" y="336" width="152" height="40" rx="4"/>
<text class="s fact-t" x="550" y="352" text-anchor="middle">Two pointers: to code</text>
<text class="s fact-t" x="550" y="368" text-anchor="middle">and to the context</text>

<line class="arr dash" x1="125" y1="384" x2="110" y2="432" marker-end="url(#a)"/>
<line class="arr dash" x1="330" y1="384" x2="268" y2="432" marker-end="url(#a)"/>
<line class="arr dash" x1="530" y1="384" x2="424" y2="432" marker-end="url(#a)"/>
<line class="arr dash" x1="570" y1="384" x2="572" y2="432" marker-end="url(#a)"/>

<rect class="known" x="40" y="434" width="135" height="56" rx="8"/>
<text class="h" x="107" y="458" text-anchor="middle">Function call</text>
<text class="s" x="107" y="477" text-anchor="middle">Known</text>
<rect class="known" x="195" y="434" width="135" height="56" rx="8"/>
<text class="h" x="262" y="458" text-anchor="middle">Memory address</text>
<text class="s" x="262" y="477" text-anchor="middle">Known</text>
<rect class="known" x="350" y="434" width="135" height="56" rx="8"/>
<text class="h" x="417" y="458" text-anchor="middle">Pointer</text>
<text class="s" x="417" y="477" text-anchor="middle">Known</text>
<rect class="known" x="505" y="434" width="135" height="56" rx="8"/>
<text class="h" x="572" y="458" text-anchor="middle">A closure</text>
<text class="s" x="572" y="477" text-anchor="middle">Known</text>

<rect class="concept" x="40" y="512" width="16" height="16" rx="3"/>
<text class="s" x="64" y="524">Concept</text>
<rect class="known" x="170" y="512" width="16" height="16" rx="3"/>
<text class="s" x="194" y="524">Known concept</text>
<line class="arr" x1="330" y1="520" x2="366" y2="520" marker-end="url(#a)"/>
<text class="s" x="376" y="524">Depends on</text>
<rect class="fact" x="40" y="540" width="16" height="16" rx="3"/>
<text class="s" x="64" y="552">Fact</text>
<rect class="step" x="170" y="540" width="16" height="16" rx="3"/>
<text class="s" x="194" y="552">Step</text>
<text class="s" x="330" y="552"><tspan class="b u">context</tspan>   Term: a name that one fact explains</text>
</svg>
