<svg xmlns="http://www.w3.org/2000/svg" width="830" height="420" viewBox="0 0 830 420" role="img">
<title>A closure: its parts, labeled on the code, and the steps that run it</title>
<desc>The closure example in the middle. On the left, its five parts: the braces, the parameter list, in, the body, and the captured value greeting, each marked in teal on the code with its name. On the right, the four steps in the order they run: line 2 stores the closure, line 5 calls it with the argument "Ana", the body on line 3 runs and prints Hello, Ana, and line 6 calls it with "Bo".</desc>
<style>
.bg{fill:#FFFFFF}
text{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;fill:#2C2C2A}
.h{font-size:14px;font-weight:600}
.s{font-size:12px}
.b{font-weight:600}
.mut{fill:#5F5E5A}
.m{font-family:Menlo,"SF Mono",monospace;font-size:11px}
.code{font-family:Menlo,"SF Mono",monospace;font-size:13px}
.lab{font-family:Menlo,"SF Mono",monospace;font-size:10px}
.codebg{fill:#F7F6F2;stroke:#D3D1C7;stroke-width:0.75}
.fact-t{fill:#085041}
.step-t{fill:#712B13}
.lf{fill:#0F6E56}
.ls{fill:#993C1D}
.hf{fill:#E1F5EE;stroke:#0F6E56;stroke-width:0.75}
.hb{fill:none;stroke:#0F6E56;stroke-width:0.75;stroke-dasharray:3 2}
.hs{fill:#FAECE7;stroke:#993C1D;stroke-width:0.75}
.bd{fill:#993C1D}
.bt{fill:#FFFFFF;font-size:11px;font-weight:700}
@media (prefers-color-scheme: dark){
.bg{fill:#1E1E1D}
text{fill:#D3D1C7}
.mut{fill:#A8A59B}
.codebg{fill:#262624;stroke:#444441}
.fact-t{fill:#9FE1CB}
.step-t{fill:#F5C4B3}
.lf{fill:#5DCAA5}
.ls{fill:#F0997B}
.hf{fill:#04342C;stroke:#5DCAA5}
.hb{stroke:#5DCAA5}
.hs{fill:#4A1B0C;stroke:#F0997B}
.bd{fill:#F0997B}
.bt{fill:#1E1E1D}
}
</style>
<rect class="bg" width="830" height="420"/>

<text class="h" x="20" y="32">A closure: its parts, and what happens when it runs</text>
<text class="s mut" x="20" y="52">The parts are marked in teal on the code. The steps are numbered in the order they run.</text>

<text class="s b" x="20" y="84">Parts</text>
<text class="s b" x="250" y="84">Code</text>
<text class="s b" x="600" y="84">Steps</text>

<!-- The code, with each part marked on it. -->
<rect class="codebg" x="250" y="96" width="330" height="268" rx="10"/>

<rect class="hf" x="297" y="122" width="67" height="19" rx="4"/>
<text class="lab lf" x="297" y="117">captured value</text>

<rect class="hf" x="360" y="162" width="12" height="19" rx="3"/>
<text class="lab lf" x="366" y="157" text-anchor="middle">braces</text>
<rect class="hf" x="375.5" y="162" width="114" height="19" rx="4"/>
<text class="lab lf" x="432.5" y="157" text-anchor="middle">parameter list</text>
<rect class="hf" x="493" y="162" width="20" height="19" rx="3"/>

<rect class="hb" x="297" y="201" width="231" height="21" rx="4"/>
<text class="lab lf" x="297" y="196">body</text>
<rect class="hf" x="368" y="203" width="66" height="17" rx="3"/>
<text class="lab lf" x="401" y="196" text-anchor="middle">captured value</text>

<rect class="hf" x="266" y="242" width="12" height="19" rx="3"/>

<rect class="hs" x="313" y="282" width="43" height="19" rx="4"/>
<text class="lab ls" x="334.5" y="277" text-anchor="middle">argument</text>
<rect class="hs" x="313" y="322" width="35" height="19" rx="4"/>

<text class="code" x="268" y="136">let greeting = "Hello"</text>
<text class="code" x="268" y="176">let greet = { (name: String) in</text>
<text class="code" x="299.3" y="216">print("\(greeting), \(name)")</text>
<text class="code" x="268" y="256">}</text>
<text class="code" x="268" y="296">greet("Ana")</text>
<text class="code" x="268" y="336">greet("Bo")</text>

<!-- The number of each step, beside the line that runs. -->
<circle class="bd" cx="562" cy="172" r="9"/><text class="bt" x="562" y="176" text-anchor="middle">1</text>
<circle class="bd" cx="562" cy="292" r="9"/><text class="bt" x="562" y="296" text-anchor="middle">2</text>
<circle class="bd" cx="562" cy="212" r="9"/><text class="bt" x="562" y="216" text-anchor="middle">3</text>
<circle class="bd" cx="562" cy="332" r="9"/><text class="bt" x="562" y="336" text-anchor="middle">4</text>

<!-- The parts. -->
<text class="s b fact-t" x="20" y="122">The braces, <tspan class="m">{</tspan> and <tspan class="m">}</tspan></text>
<text class="s" x="20" y="139">The closure starts at <tspan class="m">{</tspan> and</text>
<text class="s" x="20" y="154">ends at the matching <tspan class="m">}</tspan>.</text>

<text class="s b fact-t" x="20" y="184">The parameter list</text>
<text class="s" x="20" y="201">The inputs it takes. <tspan class="m">name</tspan> is a</text>
<text class="s" x="20" y="216">parameter, of type <tspan class="m">String</tspan>.</text>

<text class="s b fact-t" x="20" y="246"><tspan class="m">in</tspan></text>
<text class="s" x="20" y="263">It ends the parameter list.</text>
<text class="s" x="20" y="278">The body comes after it.</text>

<text class="s b fact-t" x="20" y="308">The body</text>
<text class="s" x="20" y="325">The code that runs each time</text>
<text class="s" x="20" y="340">the closure is called.</text>

<text class="s b fact-t" x="20" y="370">The captured value, <tspan class="m">greeting</tspan></text>
<text class="s" x="20" y="387">A constant from outside the</text>
<text class="s" x="20" y="402">braces that the body uses.</text>

<!-- The steps, in the order they run. -->
<circle class="bd" cx="608" cy="122" r="8"/><text class="bt" x="608" y="126" text-anchor="middle">1</text>
<text class="s step-t" x="624" y="126">Line 2 stores the closure in</text>
<text class="s step-t" x="624" y="141"><tspan class="m">greet</tspan>. The body does not run.</text>

<circle class="bd" cx="608" cy="182" r="8"/><text class="bt" x="608" y="186" text-anchor="middle">2</text>
<text class="s step-t" x="624" y="186">Line 5 calls <tspan class="m">greet</tspan> with the</text>
<text class="s step-t" x="624" y="201">argument <tspan class="m">"Ana"</tspan>.</text>

<circle class="bd" cx="608" cy="242" r="8"/><text class="bt" x="608" y="246" text-anchor="middle">3</text>
<text class="s step-t" x="624" y="246">The body on line 3 runs, with</text>
<text class="s step-t" x="624" y="261"><tspan class="m">name</tspan> set to <tspan class="m">"Ana"</tspan>. It prints</text>
<text class="s step-t" x="624" y="276"><tspan class="m">Hello, Ana</tspan>.</text>

<circle class="bd" cx="608" cy="317" r="8"/><text class="bt" x="608" y="321" text-anchor="middle">4</text>
<text class="s step-t" x="624" y="321">Line 6 calls <tspan class="m">greet</tspan> with <tspan class="m">"Bo"</tspan>,</text>
<text class="s step-t" x="624" y="336">and the body prints <tspan class="m">Hello, Bo</tspan>.</text>

<text class="s" x="250" y="394">So <tspan class="m">greet</tspan> holds two things: its code, and the <tspan class="m">greeting</tspan> it captured.</text>
</svg>
