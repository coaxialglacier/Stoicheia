<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Star Atlas</title>
<!-- Home in the constellation theme. It reads the concept library, as archive/index.html does: library-data.js, library.js, and pages.js. -->
<link rel="stylesheet" href="sky.css">
<style>
.nebula{background:
  radial-gradient(ellipse 45% 40% at 78% 38%,rgba(120,72,210,.30),transparent 70%),
  radial-gradient(ellipse 40% 35% at 40% 22%,rgba(40,90,190,.20),transparent 70%),
  radial-gradient(ellipse 45% 35% at 35% 82%,rgba(20,140,150,.18),transparent 70%),
  radial-gradient(ellipse 30% 25% at 80% 85%,rgba(200,90,140,.10),transparent 70%),
  radial-gradient(ellipse 120% 90% at 55% 45%,#0e1533,#05070f 80%)}
header .caps{color:var(--ink3)}
#finder{position:fixed;top:66px;left:14px;width:404px;z-index:4;display:flex;flex-direction:column;max-height:calc(100vh - 80px)}
.instrument{position:relative;z-index:2;display:flex;align-items:center;gap:2px;height:214px;cursor:pointer;flex:none;user-select:none}
#astro{width:212px;height:212px;flex:none;transition:filter .3s}
.instrument:hover #astro,#finder.open #astro{filter:drop-shadow(0 0 14px rgba(230,196,119,.35))}
.ins-text{display:flex;flex-direction:column;gap:5px;min-width:0}
.ins-title{font-family:Cinzel;font-size:21px;letter-spacing:.06em;color:var(--gold2);text-shadow:0 0 18px rgba(230,196,119,.3)}
.ins-count{color:var(--ink3);letter-spacing:.12em;white-space:nowrap}
.ins-input{position:relative;display:flex;align-items:center;gap:8px;margin-top:8px;padding:6px 2px 7px;border-bottom:1px solid rgba(230,196,119,.35);width:178px;cursor:text;transition:border-color .3s}
.ins-input b{color:var(--gold);font-weight:400;font-size:13px;animation:tw 1.8s ease-in-out infinite}
.ins-input input{all:unset;font-family:'EB Garamond',serif;font-style:italic;font-size:16px;color:var(--ink);width:100%;caret-color:var(--gold)}
.ins-input input::placeholder{color:var(--ink3)}
.ins-input .caret{position:absolute;left:23px;top:9px;width:1px;height:17px;background:var(--gold);animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
#finder.open .ins-input .caret,.ins-input.typing .caret{display:none}
.instrument:hover .ins-input,#finder.open .ins-input{border-color:var(--gold)}
#panel{min-height:0;overflow-y:auto;padding:20px 24px 18px;margin-top:4px;opacity:0;transform:translateY(-14px);clip-path:inset(0 -90px 100% -90px);pointer-events:none;position:relative;z-index:1;transition:opacity .35s,transform .5s cubic-bezier(.2,.8,.2,1),clip-path .55s cubic-bezier(.2,.8,.2,1)}
#finder.open #panel{opacity:1;transform:none;clip-path:inset(-90px -90px -90px -90px);pointer-events:auto}
.res{display:flex;align-items:center;gap:12px;padding:9px 4px;border-bottom:1px solid rgba(230,196,119,.08);cursor:pointer;font-family:Jost;font-size:14px;letter-spacing:.03em;color:var(--ink)}
.res:hover{color:var(--gold2)}
.res small{margin-left:auto;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink3)}
.res .d{width:10px;height:10px;border-radius:50%;flex:none;background:radial-gradient(circle,#fff 0 28%,rgba(195,176,255,.5) 40%,transparent 70%)}
.res .d.known{background:none;border:1px dashed var(--known)}
.res .d.ready{background:radial-gradient(circle,#fff 0 28%,rgba(154,217,255,.7) 40%,transparent 70%)}
.search{display:flex;align-items:center;gap:10px;border:1px solid rgba(230,196,119,.22);background:rgba(4,6,16,.55);padding:11px 14px;color:var(--ink3);font-size:16px;font-style:italic}
.search b{font-style:normal;color:var(--gold);font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.chip{font-family:Jost;font-size:12px;letter-spacing:.04em;color:var(--ink2);border:1px solid rgba(185,179,164,.18);padding:5px 11px;border-radius:20px;background:rgba(255,255,255,.02);cursor:pointer}
.chip:hover{border-color:var(--goldDim);color:var(--gold2)}
.chip.on{color:var(--gold2);border-color:var(--goldDim);background:rgba(230,196,119,.08)}
.chip.known{border-style:dashed;border-color:rgba(141,146,168,.45);color:var(--known)}
.study{margin-top:20px;padding:18px 18px 16px;position:relative;overflow:hidden;border:1px solid var(--goldDim);background:radial-gradient(ellipse 80% 120% at 100% 0%,rgba(230,196,119,.14),transparent 60%),rgba(6,9,22,.6)}
.study .caps{color:var(--gold)}
.study h2{font-family:Cinzel;font-weight:500;font-size:22px;margin:6px 0 6px;color:var(--gold2);text-shadow:0 0 18px rgba(230,196,119,.35)}
.study p{color:var(--ink2);font-size:16px;line-height:1.45}
.progress{display:flex;gap:16px;margin-top:12px;align-items:center}
.progress span{width:9px;height:9px;transform:rotate(45deg);border:1px solid var(--goldDim)}
.progress span.lit{background:var(--gold);border-color:var(--gold);box-shadow:0 0 10px var(--gold)}
.lead{font-size:17.5px;line-height:1.45;color:var(--ink)}
.lead b{font-weight:500;color:var(--gold2)}
.path{position:relative;margin-top:14px;padding-left:44px}
.path::before{content:"";position:absolute;left:15px;top:14px;bottom:30px;width:1px;background:linear-gradient(var(--gold),rgba(230,196,119,.15))}
.step{position:relative;padding-bottom:20px;transition:opacity .5s,max-height .6s .3s,padding .6s .3s;max-height:400px;overflow:hidden}
.step.gone{opacity:0;max-height:0;padding-bottom:0}
.num{position:absolute;left:-44px;top:-2px;width:31px;height:31px;display:grid;place-items:center;font-family:Cinzel;font-size:12px;color:var(--gold2);background:radial-gradient(circle,rgba(230,196,119,.30),rgba(6,9,22,.95) 70%);border:1px solid var(--goldDim);transform:rotate(45deg)}
.num span{transform:rotate(-45deg)}
.step.now .num{border-color:var(--gold);box-shadow:0 0 14px rgba(230,196,119,.55)}
.step h3{font-family:Cinzel;font-weight:500;font-size:16.5px;color:var(--ink);letter-spacing:.03em}
.step .view{font-family:Jost;text-transform:uppercase;letter-spacing:.18em;font-size:9.5px;color:var(--gold);margin:3px 0 4px}
.step p{font-size:15.5px;color:var(--ink2);line-height:1.4}
.why{margin-top:8px;padding:8px 12px;border-left:1px solid var(--gold);background:linear-gradient(90deg,rgba(230,196,119,.08),transparent);font-size:14.5px;color:var(--ink2);line-height:1.4}
.why .caps{color:var(--gold);font-size:9.5px;display:block;margin-bottom:2px}
.iknow{margin-top:8px;font-family:Jost;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);border:1px solid rgba(141,146,168,.3);padding:4px 10px;display:inline-block;border-radius:20px;cursor:pointer;transition:all .2s}
.iknow:hover{color:var(--gold2);border-color:var(--gold);box-shadow:0 0 12px rgba(230,196,119,.3)}

main{position:fixed;top:58px;left:420px;right:0;bottom:0;z-index:1}
main svg{width:100%;height:100%;display:block}
.lbl{font-family:Jost,sans-serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase;fill:var(--ink2);paint-order:stroke;stroke:#060814;stroke-width:3px;stroke-linejoin:round;pointer-events:none;transition:fill .2s}
.lbl.new{fill:#8f8ca8}.lbl.known{fill:#7d8197}.lbl.ready{fill:#cfe9ff}.lbl.path{fill:var(--gold2)}.lbl.now{fill:var(--gold2);font-size:12.5px;font-weight:500}
.region{font-family:Cinzel;font-size:14px;letter-spacing:.36em;fill:var(--gold);opacity:.75}
.rcount{font-family:Jost;font-size:9.5px;letter-spacing:.24em;fill:var(--ink3)}
.dep{transition:opacity .25s,stroke-width .25s,stroke-opacity .25s}
.far{stroke-opacity:.35}
svg.focus .far.lit{stroke-opacity:1}
svg.focus .dep{opacity:.12}
svg.focus .dep.lit{opacity:1;stroke-width:1.8}
svg.focus .lbl{fill:#5d5b70}
svg.focus .lbl.lit{fill:var(--gold2)}
.hit{cursor:pointer}

.legend{position:fixed;right:22px;bottom:20px;z-index:2;display:flex;gap:22px;align-items:center;padding:12px 20px}
.legend div{display:flex;align-items:center;gap:8px}
.legend svg{width:22px;height:22px}
#knownList{position:fixed;top:66px;right:22px;z-index:5;width:300px;padding:18px 20px;display:none}
#knownList.on{display:block;animation:fade .3s}
.krow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(230,196,119,.08);font-family:Jost;font-size:14px;color:var(--known)}
.krow .dot{width:11px;height:11px;border-radius:50%;border:1px dashed var(--known)}
.krow .iknow{margin:0 0 0 auto}

</style>
</head>
<body>
<div class="nebula"></div>
<canvas id="sky"></canvas>
<div id="stage">
<header>
  <a class="brand" href="index.html"><i>✦</i>STOICHEIA</a>
  <div class="caps">The library</div>
  <div class="grow"></div>
  <a class="hex" id="whatIKnow"><span>What I know</span></a>
</header>
<div id="knownList" class="frame"></div>

<div id="finder">
  <div class="instrument" id="instrument" title="Find an idea">
    <svg id="astro" viewBox="-110 -110 220 220"></svg>
    <div class="ins-text">
      <div class="caps">The library</div>
      <div class="ins-title">Find an idea</div>
      <div class="caps ins-count" id="insCount"></div>
      <label class="ins-input"><b>✧</b><span class="caret"></span><input id="q" placeholder="Name an idea" autocomplete="off" spellcheck="false"></label>
    </div>
  </div>
  <div class="frame" id="panel"></div>
</div>

<main><svg id="map" preserveAspectRatio="xMidYMid meet"></svg></main>

<div class="legend frame">
  <div><svg viewBox="-11 -11 22 22"><circle r="9" fill="url(#lg-new)"/><circle r="2.2" fill="#d8ccff"/></svg><span class="caps">New</span></div>
  <div><svg viewBox="-11 -11 22 22"><circle r="10" fill="url(#lg-ready)"/><circle r="3" fill="#fff"/></svg><span class="caps">Ready</span></div>
  <div><svg viewBox="-11 -11 22 22"><circle r="10" fill="url(#lg-now)"/><path d="M-10 0L0 -1L10 0L0 1ZM0 -10L1 0L0 10L-1 0Z" fill="#fff8e0"/><circle r="3" fill="#fff"/></svg><span class="caps">Studying</span></div>
  <div><svg viewBox="-11 -11 22 22"><circle r="6" fill="none" stroke="#8d92a8" stroke-dasharray="2 2.4"/><circle r="1.8" fill="#8d92a8"/></svg><span class="caps">Known</span></div>
  <svg width="0" height="0" style="position:absolute"><defs>
    <radialGradient id="lg-new"><stop offset="0" stop-color="#c3b0ff" stop-opacity=".35"/><stop offset="1" stop-color="#c3b0ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="lg-ready"><stop offset="0" stop-color="#9ad9ff" stop-opacity=".7"/><stop offset="1" stop-color="#9ad9ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="lg-now"><stop offset="0" stop-color="#e6c477" stop-opacity=".8"/><stop offset="1" stop-color="#e6c477" stop-opacity="0"/></radialGradient>
  </defs></svg>
</div>
</div>
<div id="flash"></div>
<div id="card" class="frame"></div>

<script src="sky.js"></script>
<script src="library-data.js"></script>
<script src="library.js"></script>
<script src="pages.js"></script>
<script>
// Home in the constellation theme. Everything on it comes from the concept library, through pages.js:
// the areas, the ideas and what they depend on, what the reader knows, the study in progress, and the path to an idea.
const { el } = Sky;
const svg = document.getElementById('map');
// No idea is chosen when the page opens: the map shows the whole library, and the instrument in the corner waits to be used.
let goal = null;

// A number from 0 to 1 that is always the same for the same text, so each star's small offset is the same on every load.
function hash(text) { let h = 2166136261; for (const c of text) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return ((h >>> 0) % 10000) / 10000; }
const ROMAN = n => ['', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI', 'XII'][n] || String(n);
const delay = (e, ms) => { e.style.animationDelay = ms + 'ms'; return e; };

// ---------- Where each star goes ----------
// Each area is one constellation. Inside it, each idea is in a column to the right of the ideas it needs, as on the real Home.
// Every other column is shifted down half a row, and each star moves a little, so the stars do not sit on a grid.
const COL = 180, ROW = 96;
function layout() {
  const shapes = {};
  AREAS.forEach(a => {
    const ids = areaOrder(a.id); if (!ids.length) return;
    const levels = [...new Set(ids.map(level))].sort((x, y) => x - y);
    const rows = {}, at = {};
    ids.forEach(id => { const c = levels.indexOf(level(id)); rows[c] = (rows[c] || 0) + 1; at[id] = { c, r: rows[c] - 1 }; });
    shapes[a.id] = { ids, at, w: (levels.length - 1) * COL + 230, h: 92 + (Math.max(...Object.values(rows)) - 1) * ROW + ROW / 2 + 70 };
  });
  // The constellations go in the order of the areas, left to right, and start a new row when the next one would not fit the window.
  const GAP = 46, place = {}, regions = {}, main = svg.parentElement;
  const maxW = Math.max(700, main.clientWidth - 40);
  let x = 30, y = 30, tallest = 0;
  AREAS.map(a => a.id).filter(id => shapes[id]).forEach(id => {
    const s = shapes[id];
    if (x > 30 && x + s.w > maxW) { x = 30; y += tallest + GAP; tallest = 0; }
    regions[id] = { x, y, w: s.w, h: s.h };
    s.ids.forEach(i => {
      const { c, r } = s.at[i];
      place[i] = { x: x + 60 + c * COL + (hash(i + 'x') - .5) * 40, y: y + 92 + r * ROW + (c % 2) * ROW / 2 + (hash(i + 'y') - .5) * 26 };
    });
    x += s.w + GAP; tallest = Math.max(tallest, s.h);
  });
  // The map is never drawn larger than it is: a small library sits in the middle of the window at its own size.
  const cw = Math.max(...Object.values(regions).map(r => r.x + r.w)) + 30, ch = y + tallest + 30;
  const W = Math.max(cw, main.clientWidth), H = Math.max(ch, main.clientHeight);
  return { place, regions, W, H, ox: (W - cw) / 2, oy: (H - ch) / 2 };
}
// A border with a few jogs in it, like the borders between constellations on a star atlas.
function border(r, id) {
  const j = k => (hash(id + k) - .5) * 16, x2 = r.x + r.w, y2 = r.y + r.h, mx = r.x + r.w * (.45 + hash(id + 'm') * .2), my = r.y + r.h * (.4 + hash(id + 'n') * .2);
  return [[r.x + j(1), r.y], [mx, r.y + j(2)], [mx, r.y - 10], [x2, r.y + j(3)], [x2 + j(4), my], [x2 - 14, my + 14], [x2 + j(5), y2], [r.x + r.w * .4, y2 + j(6)], [r.x + r.w * .4, y2 + 10], [r.x, y2 + j(7)], [r.x + j(8), r.y + r.h * .55]]
    .map(p => p.map(v => v.toFixed(1)).join(',')).join(' ');
}

// ---------- The emblem of each area, drawn large and faint inside its constellation: what the area is about, as a picture ----------
function emblem(g, area, r) {
  const st = { fill: 'none', stroke: 'rgba(230,196,119,.11)', 'stroke-width': 1.3 };
  const cx = r.x + r.w / 2, cy = r.y + r.h / 2 + 20;
  if (area === 'swift') {
    // A pair of braces.
    const brace = (x, y0, y1, s) => { const m = (y0 + y1) / 2;
      return `M${x + 22 * s} ${y0}C${x} ${y0} ${x} ${y0 + 12} ${x} ${y0 + 40}L${x} ${m - 34}C${x} ${m - 10} ${x - 18 * s} ${m} ${x - 24 * s} ${m}C${x - 18 * s} ${m} ${x} ${m + 10} ${x} ${m + 34}L${x} ${y1 - 40}C${x} ${y1 - 12} ${x} ${y1} ${x + 22 * s} ${y1}`; };
    el('path', { d: brace(r.x + 34, r.y + 60, r.y + r.h - 24, 1), ...st, 'stroke-width': 2 }, g);
    el('path', { d: brace(r.x + r.w - 34, r.y + 60, r.y + r.h - 24, -1), ...st, 'stroke-width': 2 }, g);
  } else if (area === 'memory') {
    // A stack of frames on one side, and blocks on the heap on the other.
    for (let i = 0; i < 5; i++) el('rect', { x: r.x + 30, y: r.y + r.h - 140 + i * 22, width: 110, height: 18, rx: 2, ...st }, g);
    [[.55, -120, 54, 34], [.68, -96, 40, 26], [.78, -128, 64, 40], [.62, -70, 30, 18]].forEach(([fx, dy, w, h]) => el('rect', { x: r.x + r.w * fx, y: r.y + r.h + dy, width: w, height: h, rx: 6, ...st }, g));
  } else if (area === 'conc') {
    // Two lanes of work that run at the same time.
    [cy - 12, cy + 12].forEach((y, i) => el('line', { x1: r.x + 24, y1: y, x2: r.x + r.w - 24, y2: y, ...st, 'stroke-dasharray': i ? '40 14 24 14' : '22 12 50 12' }, g));
  } else if (area === 'ui') {
    // Views inside each other.
    [[170, 150], [126, 110], [82, 70]].forEach(([w, h]) => el('rect', { x: cx - w / 2, y: cy - h / 2, width: w, height: h, rx: 10, ...st }, g));
  } else if (area === 'algo') {
    // A binary tree.
    const T = [[0, -70], [-72, 0], [72, 0], [-114, 74], [-36, 74], [36, 74], [114, 74]].map(([x, y]) => [cx + x, cy + y]);
    [[0, 1], [0, 2], [1, 3], [1, 4], [2, 5], [2, 6]].forEach(([a, b]) => el('line', { x1: T[a][0], y1: T[a][1], x2: T[b][0], y2: T[b][1], ...st }, g));
    T.forEach(([x, y]) => el('circle', { cx: x, cy: y, r: 7, ...st }, g));
  }
}

// ---------- The path to the chosen idea ----------
function pathOf(id) {
  const steps = id ? studyPath(id) : [];
  const nums = {};
  steps.forEach((s, i) => { (nums[s.id] = nums[s.id] || []).push(ROMAN(i + 1)); });
  return { steps, nums, ids: new Set(steps.map(s => s.id)) };
}
function starState(id, P) {
  if (KNOWN.has(id)) return 'known';
  if (id === goal) return 'now';
  if (P.ids.has(id)) return 'path';
  return isReady(id) ? 'ready' : 'new';
}
const RADIUS = { known: 5, new: 4, ready: 5, path: 6.5, now: 9 };
// A bowed curve from p to q, trimmed so that it starts and ends a little outside each star.
function bow(p, q, bend, gapP, gapQ) {
  const mx = (p.x + q.x) / 2, my = (p.y + q.y) / 2, dx = q.x - p.x, dy = q.y - p.y;
  const cx = mx - dy * bend, cy = my + dx * bend;
  const a = Math.hypot(cx - p.x, cy - p.y) || 1, b = Math.hypot(q.x - cx, q.y - cy) || 1;
  return `M${(p.x + (cx - p.x) / a * gapP).toFixed(1)} ${(p.y + (cy - p.y) / a * gapP).toFixed(1)}Q${cx.toFixed(1)} ${cy.toFixed(1)} ${(q.x - (q.x - cx) / b * gapQ).toFixed(1)} ${(q.y - (q.y - cy) / b * gapQ).toFixed(1)}`;
}

// ---------- The map ----------
function render(animate) {
  const L = layout(), P = pathOf(goal), A = animate ? 1 : 0;
  svg.innerHTML = '';
  svg.setAttribute('viewBox', `${-L.ox} ${-L.oy} ${L.W} ${L.H}`);
  const d = Sky.defsFor(svg);

  // A faint grid of the sky, like the lines of a star atlas.
  const grid = el('g', { class: A ? 'fade' : '' }, svg), gx = L.W / 2 - L.ox, gy = L.H - L.oy + 600;
  [1, 2, 3, 4].forEach(k => el('circle', { cx: gx, cy: gy, r: 600 + k * 170, fill: 'none', stroke: 'rgba(150,170,255,.07)', 'stroke-dasharray': '1 7' }, grid));
  [-0.5, -0.2, 0.1, 0.4].forEach(a => el('line', { x1: gx, y1: gy, x2: gx + Math.sin(a) * 2000, y2: gy - Math.cos(a) * 2000, stroke: 'rgba(150,170,255,.06)', 'stroke-dasharray': '1 7' }, grid));

  // The constellations: a dotted border, the emblem, the name, and how many ideas each has.
  Object.entries(L.regions).forEach(([id, r], i) => {
    const g = delay(el('g', { class: A ? 'fade' : '' }, svg), 150 + i * 120);
    emblem(g, id, r);
    el('polygon', { points: border(r, id), fill: 'none', stroke: 'rgba(230,196,119,.5)', 'stroke-width': 1.6, 'stroke-dasharray': '0.1 6', 'stroke-linecap': 'round' }, g);
    el('text', { x: r.x + 26, y: r.y + 36, class: 'region' }, g).textContent = areaName(id).toUpperCase();
    const n = areaOrder(id).length;
    el('text', { x: r.x + 26, y: r.y + 53, class: 'rcount' }, g).textContent = n + (n === 1 ? ' IDEA' : ' IDEAS');
  });

  // The rings that turn slowly behind the chosen idea.
  const sel = goal && L.place[goal];
  if (sel) {
    const turn = delay(el('g', { class: A ? 'fade' : '' }, svg), 2200), spin = el('g', {}, turn);
    el('animateTransform', { attributeName: 'transform', type: 'rotate', from: `0 ${sel.x} ${sel.y}`, to: `360 ${sel.x} ${sel.y}`, dur: '160s', repeatCount: 'indefinite' }, spin);
    el('circle', { cx: sel.x, cy: sel.y, r: 64, fill: 'none', stroke: 'rgba(230,196,119,.16)' }, spin);
    el('circle', { cx: sel.x, cy: sel.y, r: 96, fill: 'none', stroke: 'rgba(230,196,119,.10)', 'stroke-dasharray': '2 5' }, spin);
    for (let i = 0; i < 72; i++) {
      const a = i / 72 * Math.PI * 2, r2 = i % 6 ? 69 : 76;
      el('line', { x1: sel.x + Math.cos(a) * 64, y1: sel.y + Math.sin(a) * 64, x2: sel.x + Math.cos(a) * r2, y2: sel.y + Math.sin(a) * r2, stroke: 'rgba(230,196,119,.28)', 'stroke-width': .7 }, spin);
    }
  }

  // Every "depends on", from the idea it needs to the idea that needs it. A line on the path is gold, and light moves along it toward the chosen idea.
  // A line from a known idea to the path is gold and dashed. A line between two areas is fainter until one of its stars is pointed at.
  const onPath = id => P.ids.has(id);
  let i = 0, k = 0;
  for (const a in IDEAS) IDEAS[a].deps.forEach(b => {
    const p = L.place[b], q = L.place[a]; if (!p || !q) return;
    const sa = starState(a, P), sb = starState(b, P), bend = (i++ % 2 ? .14 : -.14);
    const dd = bow(p, q, bend, RADIUS[sb] * 2.2, RADIUS[sa] * 2.2);
    if (onPath(a) && onPath(b)) {
      const at = 1600 + (k++) * 260;
      delay(el('path', { d: dd, pathLength: 1, fill: 'none', stroke: '#e6c477', 'stroke-width': 5, opacity: .35, filter: 'url(#glow)', class: 'dep' + (A ? ' draw' : ''), 'data-a': a, 'data-b': b }, svg), at);
      delay(el('path', { d: dd, pathLength: 1, fill: 'none', stroke: d.line(p.x, p.y, q.x, q.y, 'rgba(230,196,119,.55)', '#fbe7b0'), 'stroke-width': 1.4, class: 'dep' + (A ? ' draw' : ''), 'data-a': a, 'data-b': b }, svg), at);
      const g = delay(el('g', { class: A ? 'fade' : '' }, svg), 2800);
      el('path', { d: dd, fill: 'none', stroke: '#fffbe8', 'stroke-width': 2.2, class: 'travel dep', 'stroke-linecap': 'round', 'data-a': a, 'data-b': b }, g);
    } else {
      const fromKnown = KNOWN.has(b) && onPath(a);
      const path = el('path', { d: dd, pathLength: 1, fill: 'none', 'data-a': a, 'data-b': b, class: 'dep' + (A ? ' draw' : ''), 'stroke-width': 1,
        stroke: fromKnown ? 'rgba(230,196,119,.5)' : d.line(p.x, p.y, q.x, q.y, 'rgba(154,217,255,.30)', 'rgba(195,176,255,.45)') }, svg);
      if (IDEAS[a].area !== IDEAS[b].area && !fromKnown) path.classList.add('far');
      delay(path, 700 + i * 35);
    }
  });

  // The stars light up from left to right, then their names and the numbers of the path appear.
  for (const id in L.place) {
    const s = L.place[id], st = starState(id, P), r = RADIUS[st];
    const g = el('g', { transform: `translate(${s.x},${s.y})`, class: 'hit', 'data-id': id }, svg);
    const col = { new: '#c3b0ff', ready: '#9ad9ff', path: '#e6c477', now: '#e6c477' }[st];
    const o = Sky.star(g, d, { r, known: st === 'known', color: col, strength: { new: .5, ready: 1, path: 1, now: 1.3 }[st], dim: st === 'new',
      flare: st === 'new' ? 0 : st === 'now' ? 6 : 3.6, flareOpacity: st === 'now' ? .8 : .45 });
    if (A) { o.classList.add('ignite'); delay(o, 350 + s.x * .7); }
    el('circle', { r: 18, fill: 'transparent' }, g);
    const lbl = el('text', { x: s.x, y: s.y + r + (st === 'now' ? 26 : 18), 'text-anchor': 'middle', class: 'lbl ' + st + (A ? ' fade' : ''), 'data-id': id }, svg);
    lbl.textContent = IDEAS[id].name; if (A) delay(lbl, 600 + s.x * .7);
    if (P.nums[id] && st !== 'known') {
      const text = P.nums[id].join(' · '), w = text.length > 3 ? text.length * 8 + 10 : 22;
      const b = el('g', { transform: `translate(${s.x - r - 8 - w / 2},${s.y - r - 10})` }, svg);
      const inner = delay(el('g', { class: A ? 'fade' : '' }, b), 2000);
      el('rect', { x: -w / 2, y: -9, width: w, height: 18, fill: 'rgba(8,10,24,.9)', stroke: 'rgba(230,196,119,.6)', 'stroke-width': .8 }, inner);
      el('text', { y: 4, 'text-anchor': 'middle', style: 'font-family:Cinzel;font-size:10.5px;fill:#fbe7b0;letter-spacing:.06em' }, inner).textContent = text;
    }
  }

  panel(P);
  astrolabe(L, P);
}

// ---------- The finder: the instrument in the corner, and the panel that unfolds from it ----------
// The panel lists ideas to go to: suggestions, or the ideas that match what is typed. Once an idea is chosen, it shows the path to it.
const finder = document.getElementById('finder'), q = document.getElementById('q');
function panel(P) {
  const S = STUDYING.id, text = q.value.trim().toLowerCase();
  const chip = (id, label) => `<span class="chip ${id === goal ? 'on' : ''}" data-goal="${id}">${label}</span>`;
  const dot = id => KNOWN.has(id) ? 'known' : isReady(id) ? 'ready' : '';
  let html = '';
  if (text) {
    const hits = Object.keys(IDEAS).filter(id => IDEAS[id].name.toLowerCase().includes(text) || IDEAS[id].first.toLowerCase().includes(text));
    html += `<div class="caps" style="margin-bottom:4px">${hits.length ? 'Ideas that match' : 'No idea matches yet'}</div>` +
      hits.map(id => `<div class="res" data-goal="${id}"><span class="d ${dot(id)}"></span>${IDEAS[id].name}<small>${areaName(IDEAS[id].area)}</small></div>`).join('');
  } else {
    const others = TEACHING_ORDER.filter(id => id !== S && !KNOWN.has(id)).slice(-5);
    html += `<div class="caps" style="margin-bottom:10px">Where do you want to get to?</div>
      <div class="chips" style="margin-top:0">${chip(S, 'Your study: ' + IDEAS[S].name)}${others.map(id => chip(id, IDEAS[id].name)).join('')}</div>`;
  }
  if (goal) {
    html += `<div class="rule">✦</div>`;
    if (KNOWN.has(goal)) html += `<p class="lead">You know <b>${IDEAS[goal].name}</b>.</p>`;
    else {
      const on = [...P.ids].filter(id => id !== goal).length;
      const start = [...new Set(P.steps.flatMap(s => IDEAS[s.id].deps).filter(d => KNOWN.has(d)))];
      html += `<p class="lead">${on ? `To get to <b>${IDEAS[goal].name}</b>, you learn <b>${on === 1 ? '1 idea' : on + ' ideas'}</b> on the way, in this order.` : `You know everything <b>${IDEAS[goal].name}</b> needs.`}</p>`;
      if (start.length) html += `<div class="caps" style="margin:16px 0 8px">You start from what you know</div><div class="chips" style="margin-top:0">${start.map(id => `<span class="chip known">${IDEAS[id].name}</span>`).join('')}</div>`;
      html += `<div class="caps" style="margin:22px 0 4px">The path</div><div class="path">` + P.steps.map((s, i) => {
        // The reason for a step: the first later step that needs it, and why.
        const later = P.steps.slice(i + 1).find(t => IDEAS[t.id].deps.includes(s.id) && t.id !== s.id);
        return `<div class="step ${i === 0 ? 'now' : ''}" data-id="${s.id}"><div class="num"><span>${ROMAN(i + 1)}</span></div><h3>${IDEAS[s.id].name}</h3>` +
          (VIEW_LABEL[s.view] ? `<div class="view">${VIEW_LABEL[s.view]}</div>` : '') +
          `<p>${Library.escapeHTML(IDEAS[s.id].first)}</p>` +
          (later ? `<div class="why"><span class="caps">Needed for ${IDEAS[later.id].name.toLowerCase()}</span>${Library.textHTML(why(later.id, s.id))}</div>` : '') +
          (s.id !== goal ? `<span class="iknow" data-know="${s.id}">I know this</span>` : '') + `</div>`;
      }).join('') + `</div>`;
    }
  }
  const box = document.getElementById('panel');
  box.innerHTML = html;
  box.querySelectorAll('[data-goal]').forEach(c => c.onclick = () => { q.value = ''; choose(c.dataset.goal); });
  // "I know this" on a step: the step leaves the path, and its star flares and becomes a known star.
  // saveKnown writes the change to known.json when library/server.js serves the page, the same as the real Home.
  box.querySelectorAll('[data-know]').forEach(b => b.onclick = () => {
    const id = b.dataset.know, s = layout().place[id];
    b.closest('.step').classList.add('gone');
    if (s) Sky.burst(svg, s.x, s.y, '#fbe7b0', 14);
    setTimeout(() => { KNOWN.add(id); saveKnown({ add: id }); render(false); if (s) Sky.burst(svg, s.x, s.y, '#8d92a8', 9); }, 450);
  });
}
function openFinder(focus) {
  finder.classList.add('open');
  if (focus) q.focus();
}
// Closing the finder takes everything away: the panel, what was typed, and the chosen idea with its path.
function closeFinder() {
  finder.classList.remove('open'); q.blur(); q.value = '';
  document.querySelector('.ins-input').classList.remove('typing');
  if (goal) { goal = null; render(false); } else panel(pathOf(null));
}
document.getElementById('instrument').addEventListener('click', () => openFinder(true));
q.addEventListener('input', () => { document.querySelector('.ins-input').classList.toggle('typing', !!q.value); openFinder(); panel(pathOf(goal)); });
q.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeFinder();
  if (e.key === 'Enter') { const first = document.querySelector('#panel .res'); if (first) { q.value = ''; choose(first.dataset.goal); } }
});
addEventListener('keydown', e => { if (e.key === 'Escape') closeFinder(); });

// ---------- The instrument: an astrolabe with a small copy of the library's stars in the middle ----------
// Its rings turn, and its sighting arm sweeps across the stars. The chosen idea, and the ideas on its path, are gold in it too.
function astrolabe(L, P) {
  const A = document.getElementById('astro'); A.innerHTML = '';
  const g = el('g', {}, A);
  const ring = el('g', {}, g);
  el('animateTransform', { attributeName: 'transform', type: 'rotate', from: '0', to: '360', dur: '200s', repeatCount: 'indefinite' }, ring);
  el('circle', { r: 100, fill: 'none', stroke: 'rgba(230,196,119,.45)' }, ring);
  el('circle', { r: 104, fill: 'none', stroke: 'rgba(230,196,119,.15)', 'stroke-dasharray': '1 4' }, ring);
  for (let i = 0; i < 120; i++) {
    const a = i / 120 * Math.PI * 2, r1 = i % 10 ? 96 : 91;
    el('line', { x1: Math.cos(a) * r1, y1: Math.sin(a) * r1, x2: Math.cos(a) * 100, y2: Math.sin(a) * 100, stroke: 'rgba(230,196,119,.45)', 'stroke-width': .7 }, ring);
  }
  const marks = el('g', {}, g);
  el('animateTransform', { attributeName: 'transform', type: 'rotate', from: '360', to: '0', dur: '260s', repeatCount: 'indefinite' }, marks);
  for (let i = 0; i < 12; i++) {
    const a = i / 12 * Math.PI * 2;
    el('text', { x: Math.cos(a) * 84, y: Math.sin(a) * 84 + 2.6, 'text-anchor': 'middle', style: `font-size:${i % 3 ? 6 : 8.5}px;fill:rgba(251,231,176,${i % 3 ? .45 : .8})` }, marks).textContent = '✦';
  }
  el('circle', { r: 76, fill: 'rgba(8,11,28,.55)', stroke: 'rgba(230,196,119,.3)', 'stroke-dasharray': '2 3' }, g);
  // The library in small: every star, and every "depends on" between them.
  const pts = Object.values(L.place), xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  const w = Math.max(...xs) - Math.min(...xs) || 1, h = Math.max(...ys) - Math.min(...ys) || 1, k = 104 / Math.max(w, h);
  const at = id => [(L.place[id].x - (Math.min(...xs) + w / 2)) * k, (L.place[id].y - (Math.min(...ys) + h / 2)) * k];
  for (const a in IDEAS) IDEAS[a].deps.forEach(b => { if (!L.place[a] || !L.place[b]) return; const [x1, y1] = at(b), [x2, y2] = at(a);
    const lit = P.ids.has(a) && P.ids.has(b);
    el('line', { x1, y1, x2, y2, stroke: lit ? 'rgba(251,231,176,.75)' : 'rgba(195,176,255,.22)', 'stroke-width': lit ? .9 : .6 }, g); });
  for (const id in L.place) {
    const [x, y] = at(id), gold = id === goal || P.ids.has(id);
    el('circle', { cx: x, cy: y, r: id === goal ? 3.2 : 1.9, fill: KNOWN.has(id) ? 'rgba(141,146,168,.8)' : gold ? '#fbe7b0' : '#e8e4ff', class: 'halo', style: `animation-delay:${(-hashOf(id) * 4).toFixed(2)}s` }, g);
  }
  // The sighting arm: a gold rule through the middle, with a lens at one end.
  const arm = el('g', {}, g);
  el('animateTransform', { attributeName: 'transform', type: 'rotate', from: '0', to: '360', dur: '48s', repeatCount: 'indefinite' }, arm);
  el('line', { x1: -72, y1: 0, x2: 72, y2: 0, stroke: 'rgba(230,196,119,.75)', 'stroke-width': 1.2 }, arm);
  el('polygon', { points: '72,0 62,-3.5 62,3.5', fill: '#e6c477' }, arm);
  el('circle', { cx: -62, cy: 0, r: 7, fill: 'rgba(230,196,119,.08)', stroke: '#e6c477', 'stroke-width': 1 }, arm);
  el('circle', { cx: -62, cy: 0, r: 2, fill: '#fbe7b0' }, arm);
  el('circle', { r: 3.5, fill: '#fff3cf' }, g);
  document.getElementById('insCount').textContent = `${Object.keys(IDEAS).length} ideas · ${Object.keys(L.regions).length} constellations`;
}
function hashOf(text) { let h = 2166136261; for (const c of text) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return ((h >>> 0) % 10000) / 10000; }

function choose(id) {
  goal = id; openFinder(); render(false);
  const s = layout().place[id]; if (s) Sky.burst(svg, s.x, s.y, '#e6c477', 8);
}

// ---------- Pointing at a star lights its lines and shows its card. Clicking it chooses it. ----------
svg.addEventListener('mouseover', e => {
  const g = e.target.closest('g.hit'); if (!g) return;
  const id = g.dataset.id, I = IDEAS[id];
  svg.classList.add('focus');
  svg.querySelectorAll('.dep').forEach(p => p.classList.toggle('lit', p.dataset.a === id || p.dataset.b === id));
  const near = new Set([id, ...I.deps, ...Object.keys(IDEAS).filter(k => IDEAS[k].deps.includes(id))]);
  svg.querySelectorAll('.lbl').forEach(l => l.classList.toggle('lit', near.has(l.dataset.id)));
  const needs = unknownNeeds(id).map(n => IDEAS[n].name);
  const note = KNOWN.has(id) ? 'Known' : id === STUDYING.id ? stateText(id) : needs.length ? `Needs ${needs.length} first: ${needs.join(', ')}` : 'Ready · you know everything it needs';
  const b = g.getBoundingClientRect();
  Sky.show({ name: I.name, first: Library.escapeHTML(I.first), note, tone: KNOWN.has(id) ? 'known' : isReady(id) ? 'ready' : '' }, b.x + b.width / 2, b.y + b.height / 2);
});
svg.addEventListener('mouseout', e => {
  const from = e.target.closest('g.hit');
  if (!from || (e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('g.hit') === from)) return;
  svg.classList.remove('focus'); Sky.hide();
});
// The first click on a star chooses it. A second click on the chosen star examines it: Expand to Parts opens on that idea, from that star.
svg.addEventListener('click', e => {
  const g = e.target.closest('g.hit'); if (!g) { closeFinder(); return; }
  Sky.hint.cancel(); armed = null;
  if (g.dataset.id !== goal) { choose(g.dataset.id); return; }
  const b = g.getBoundingClientRect();
  Sky.go(`expand.html?root=${goal}`, b.x + b.width / 2, b.y + b.height / 2);
});
// Resting the pointer on the chosen star brings out the Examine tag, which follows the pointer while it stays on that star.
let armed = null;
svg.addEventListener('mousemove', e => {
  const g = e.target.closest('g.hit'), on = g && g.dataset.id === goal;
  if (on && armed !== goal) { armed = goal; Sky.hint.arm(e.clientX, e.clientY); }
  else if (on) Sky.hint.move(e.clientX, e.clientY);
  else if (armed) { armed = null; Sky.hint.cancel(); }
});
svg.addEventListener('mouseleave', () => { armed = null; Sky.hint.cancel(); });

// ---------- What I know: every id in known.json, each of which can be taken off the list ----------
function knownPanel() {
  const box = document.getElementById('knownList');
  box.innerHTML = `<div class="caps" style="color:var(--gold)">What I know</div>` +
    ([...KNOWN].map(id => `<div class="krow"><span class="dot"></span>${NAMES[id] || id}<span class="iknow" data-forget="${id}">Remove</span></div>`).join('') || '<p class="lead" style="font-size:15px">Nothing yet.</p>');
  box.querySelectorAll('[data-forget]').forEach(b => b.onclick = () => { KNOWN.delete(b.dataset.forget); saveKnown({ remove: b.dataset.forget }); knownPanel(); render(false); });
}
document.getElementById('whatIKnow').onclick = () => { const box = document.getElementById('knownList'); box.classList.toggle('on'); if (box.classList.contains('on')) knownPanel(); };

render(true);
</script>
</body>
</html>
